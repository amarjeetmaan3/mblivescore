<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>M.B. Live Studio - Broadcast Overlay</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
}

body{
    background:transparent;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
}


/* =====================================================
   SCOREBUG
===================================================== */

#scorebug{

    position:absolute;

    left:50px;
    bottom:50px;

    display:flex;

    border:2px solid #ffd54a;
    border-radius:9px;

    overflow:hidden;

    box-shadow:
        0 5px 18px rgba(0,0,0,.65);

    transition:.25s;

}

.hidden{
    opacity:0!important;
    visibility:hidden;
}


.team-box{

    min-width:210px;

    padding:9px 17px;

    background:#001d3b;

}

.team-name{

    font-size:27px;

    font-weight:900;

    text-transform:uppercase;

}

.match-title{

    font-size:10px;

    color:#b9c7df;

    margin-top:3px;

}


.score-box{

    background:#fff;

    color:#000;

    min-width:130px;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:37px;

    font-weight:900;

}

.score-box span{
    display:inline-block;
}

.separator{
    color:#777;
    margin:0 5px;
}


.overs-box{

    min-width:125px;

    background:#c62838;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

}

.overs-label{
    font-size:10px;
}

.overs-value{
    font-size:23px;
    font-weight:900;
}


/* =====================================================
   CURRENT OVER
===================================================== */

#currentOver{

    position:absolute;

    left:50px;
    bottom:118px;

    display:flex;

    gap:5px;

    opacity:0;

    transition:.2s;

}

#currentOver.show{
    opacity:1;
}

.over-ball{

    min-width:31px;

    padding:6px 8px;

    text-align:center;

    border-radius:4px;

    background:#14294c;

    font-weight:bold;

    font-size:13px;

}

.over-four,
.over-six{
    background:#1768a7;
}

.over-wicket{
    background:#b52c3c;
}

.over-extra{
    background:#67489d;
}


/* =====================================================
   BATSMAN
===================================================== */

#batsman{

    position:absolute;

    left:50px;
    bottom:175px;

    width:440px;

    background:#061b35;

    border-left:5px solid #ffd54a;

    border-radius:6px;

    overflow:hidden;

    opacity:0;

    transform:translateX(-25px);

    transition:.25s;

}

#batsman.show{

    opacity:1;

    transform:translateX(0);

}

.graphic-header{

    padding:6px 12px;

    background:#003c70;

    color:#ffd54a;

    font-size:11px;

    font-weight:bold;

}

.player-row{

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:11px 13px;

}

.player-name{

    font-size:23px;

    font-weight:900;

}

.player-stats{

    text-align:right;

    font-size:18px;

    font-weight:bold;

}

.player-stats small{

    display:block;

    color:#a8b6d2;

    font-size:10px;

}


/* =====================================================
   BOWLER
===================================================== */

#bowler{

    position:absolute;

    right:50px;
    bottom:50px;

    width:390px;

    background:#061b35;

    border-right:5px solid #ffd54a;

    border-radius:6px;

    overflow:hidden;

    opacity:0;

    transform:translateX(25px);

    transition:.25s;

}

#bowler.show{

    opacity:1;

    transform:translateX(0);

}

.bowler-row{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:12px;

}

.bowler-name{

    font-size:22px;

    font-weight:900;

}

.bowler-stats{

    font-weight:bold;

    text-align:right;

}

.bowler-stats small{

    display:block;

    font-size:10px;

    color:#a8b6d2;

}


/* =====================================================
   LOWER THIRD
===================================================== */

#lower{

    position:absolute;

    left:50px;
    bottom:260px;

    min-width:400px;

    max-width:650px;

    background:#06203e;

    border-left:6px solid #ffd54a;

    padding:12px 18px;

    border-radius:5px;

    opacity:0;

    transform:translateX(-30px);

    transition:.25s;

}

#lower.show{

    opacity:1;

    transform:translateX(0);

}

.lower-label{

    color:#ffd54a;

    font-size:10px;

    font-weight:bold;

}

.lower-text{

    font-size:25px;

    font-weight:900;

}


/* =====================================================
   SPONSOR
===================================================== */

#sponsor{

    position:absolute;

    top:25px;

    right:25px;

    background:rgba(0,0,0,.78);

    border:1px solid #ffd54a;

    border-radius:5px;

    padding:9px 16px;

    font-size:15px;

    font-weight:bold;

    opacity:0;

    transition:.25s;

}

#sponsor.show{
    opacity:1;
}


/* =====================================================
   ANNOUNCEMENT
===================================================== */

#announcement{

    position:absolute;

    left:50%;
    top:42%;

    transform:
        translate(-50%,-50%)
        scale(.9);

    min-width:450px;

    max-width:80%;

    text-align:center;

    background:rgba(0,29,59,.97);

    border:3px solid #ffd54a;

    border-radius:10px;

    padding:18px 28px;

    font-size:30px;

    font-weight:900;

    box-shadow:
        0 8px 35px rgba(0,0,0,.7);

    opacity:0;

    transition:.25s;

}

#announcement.show{

    opacity:1;

    transform:
        translate(-50%,-50%)
        scale(1);

}


/* =====================================================
   RESULT
===================================================== */

#result{

    position:absolute;

    left:50%;
    top:38%;

    transform:translate(-50%,-50%);

    min-width:500px;

    text-align:center;

    background:rgba(0,29,59,.98);

    border:3px solid #ffd54a;

    border-radius:11px;

    padding:25px 35px;

    opacity:0;

    transition:.25s;

}

#result.show{
    opacity:1;
}

.result-label{

    color:#ffd54a;

    font-size:14px;

    font-weight:bold;

}

.result-text{

    font-size:34px;

    font-weight:900;

    margin-top:8px;

}


/* =====================================================
   MATCH TITLE
===================================================== */

#matchInfo{

    position:absolute;

    top:25px;
    left:50%;

    transform:translateX(-50%);

    background:rgba(0,0,0,.65);

    padding:6px 14px;

    border-radius:4px;

    font-size:13px;

    opacity:0;

}

#matchInfo.show{
    opacity:1;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:700px){

    #scorebug{

        left:15px;
        bottom:25px;

        transform:scale(.72);

        transform-origin:left bottom;

    }

    #currentOver{

        left:15px;
        bottom:88px;

        transform:scale(.8);

        transform-origin:left bottom;

    }

    #batsman{

        left:15px;
        bottom:125px;

        transform:scale(.72);

        transform-origin:left bottom;

    }

    #bowler{

        right:15px;
        bottom:25px;

        transform:scale(.68);

        transform-origin:right bottom;

    }

}

</style>
</head>

<body>


<!-- =====================================================
     SCOREBUG
===================================================== -->

<div id="scorebug">

    <div class="team-box">

        <div id="teamName"
             class="team-name">
            TEAM
        </div>

        <div id="matchTitle"
             class="match-title">
            LIVE MATCH
        </div>

    </div>


    <div class="score-box">

        <span id="runs">0</span>

        <span class="separator">/</span>

        <span id="wickets">0</span>

    </div>


    <div class="overs-box">

        <div class="overs-label">
            OVERS
        </div>

        <div id="overs"
             class="overs-value">
            0.0
        </div>

    </div>

</div>


<!-- =====================================================
     MATCH INFO
===================================================== -->

<div id="matchInfo">

    <span id="tournament">
        LIVE CRICKET
    </span>

</div>


<!-- =====================================================
     CURRENT OVER
===================================================== -->

<div id="currentOver"></div>


<!-- =====================================================
     BATSMAN
===================================================== -->

<div id="batsman">

    <div class="graphic-header">
        BATSMAN
    </div>

    <div class="player-row">

        <div>

            <div id="striker"
                 class="player-name">
                -
            </div>

        </div>

        <div class="player-stats">

            <span id="strikerRuns">
                0
            </span>

            (
            <span id="strikerBalls">
                0
            </span>
            )

            <small>

                4s:
                <span id="strikerFours">0</span>

                &nbsp;

                6s:
                <span id="strikerSixes">0</span>

            </small>

        </div>

    </div>

</div>


<!-- =====================================================
     BOWLER
===================================================== -->

<div id="bowler">

    <div class="graphic-header">
        BOWLER
    </div>

    <div class="bowler-row">

        <div id="bowlerName"
             class="bowler-name">
            -
        </div>

        <div class="bowler-stats">

            <span id="bowlerOvers">
                0.0
            </span>

            -

            <span id="bowlerRuns">
                0
            </span>

            -

            <span id="bowlerWickets">
                0
            </span>

            <small>
                O - R - W
            </small>

        </div>

    </div>

</div>


<!-- =====================================================
     LOWER THIRD
===================================================== -->

<div id="lower">

    <div class="lower-label">
        LIVE UPDATE
    </div>

    <div id="lowerText"
         class="lower-text">
    </div>

</div>


<!-- =====================================================
     SPONSOR
===================================================== -->

<div id="sponsor">

    <span id="sponsorText">
    </span>

</div>


<!-- =====================================================
     ANNOUNCEMENT
===================================================== -->

<div id="announcement">

    <span id="announcementText">
    </span>

</div>


<!-- =====================================================
     RESULT
===================================================== -->

<div id="result">

    <div class="result-label">
        MATCH RESULT
    </div>

    <div id="resultText"
         class="result-text">
    </div>

</div>


<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";


import {
    getDatabase,
    ref,
    onValue
}
from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";


/* EXACT SAME CONFIG AS CONTROLLER */

const firebaseConfig = {

    apiKey:
    "AIzaSyAVo8B0n12e13eJJMjsh4U9zWUuoqaLnbM",

    authDomain:
    "mbtoaj.firebaseapp.com",

    databaseURL:
    "https://mbtoaj-default-rtdb.firebaseio.com",

    projectId:
    "mbtoaj",

    storageBucket:
    "mbtoaj.firebasestorage.app",

    messagingSenderId:
    "100171222080",

    appId:
    "1:100171222080:web:b7b90f66affc8561b8e3a5"

};


const app =
    initializeApp(firebaseConfig);

const db =
    getDatabase(app);

const matchRef =
    ref(db,"current_match");


/* =====================================================
   REAL-TIME LISTENER
===================================================== */

onValue(
    matchRef,
    snapshot=>{

        const match =
            snapshot.val();

        if(!match){

            hideEverything();

            return;

        }

        render(match);

    },

    error=>{

        console.error(
            "Firebase Overlay Error:",
            error
        );

    }
);


/* =====================================================
   RENDER
===================================================== */

function render(match){

    const inn =
        match.innings[
            match.currentInnings
        ];


    const batting =
        match.teams[
            inn.battingTeam
        ];


    const batsmen =
        batting.players || [];


    const bowling =
        match.teams[
            inn.bowlingTeam
        ];


    const bowlers =
        bowling.players || [];


    const striker =
        batsmen[
            inn.striker
        ];


    const bowler =
        bowlers[
            inn.bowler
        ];


    /* SCOREBUG */

    setText(
        "teamName",
        batting.name
    );

    setText(
        "runs",
        inn.runs
    );

    setText(
        "wickets",
        inn.wickets
    );

    setText(
        "overs",
        ballsToOvers(
            inn.legalBalls
        )
    );


    setText(
        "matchTitle",
        match.matchName ||
        "LIVE MATCH"
    );


    setText(
        "tournament",
        match.tournament ||
        "LIVE CRICKET"
    );


    toggle(
        "scorebug",
        match.graphics.scorebug
    );


    /* CURRENT OVER */

    renderCurrentOver(inn);


    /* BATSMAN */

    if(striker){

        setText(
            "striker",
            striker.name
        );

        setText(
            "strikerRuns",
            striker.runs
        );

        setText(
            "strikerBalls",
            striker.balls
        );

        setText(
            "strikerFours",
            striker.fours
        );

        setText(
            "strikerSixes",
            striker.sixes
        );

    }


    toggle(
        "batsman",
        match.graphics.batsman &&
        Boolean(striker)
    );


    /* BOWLER */

    if(bowler){

        setText(
            "bowlerName",
            bowler.name
        );

        setText(
            "bowlerOvers",
            ballsToOvers(
                bowler.legalBalls
            )
        );

        setText(
            "bowlerRuns",
            bowler.conceded
        );

        setText(
            "bowlerWickets",
            bowler.wickets
        );

    }


    toggle(
        "bowler",
        match.graphics.bowler &&
        Boolean(bowler)
    );


    /* LOWER THIRD */

    setText(
        "lowerText",
        match.situation ||
        match.customText ||
        ""
    );


    toggle(
        "lower",
        match.graphics.lower &&
        Boolean(
            match.situation ||
            match.customText
        )
    );


    /* SPONSOR */

    setText(
        "sponsorText",
        match.sponsorText ||
        ""
    );


    toggle(
        "sponsor",
        match.graphics.sponsor &&
        Boolean(match.sponsorText)
    );


    /* ANNOUNCEMENT */

    setText(
        "announcementText",
        match.customText ||
        match.situation ||
        ""
    );


    toggle(
        "announcement",
        match.graphics.announcement &&
        Boolean(
            match.customText ||
            match.situation
        )
    );


    /* RESULT */

    setText(
        "resultText",
        match.customText ||
        match.situation ||
        ""
    );


    toggle(
        "result",
        match.graphics.result &&
        Boolean(
            match.customText ||
            match.situation
        )
    );


    document
        .getElementById("matchInfo")
        .classList.add("show");

}


/* =====================================================
   CURRENT OVER
===================================================== */

function renderCurrentOver(inn){

    const container =
        document.getElementById(
            "currentOver"
        );


    if(!inn.balls ||
       !inn.balls.length){

        container.classList.remove("show");

        return;

    }


    const start =
        Math.floor(
            Math.max(
                0,
                inn.legalBalls-1
            ) / 6
        ) * 6;


    const balls =
        inn.balls.slice(start);


    container.innerHTML =
        balls.map(b=>{

            let cls =
                "over-ball";

            if(
                b.type==="wicket"
            )
                cls+=" over-wicket";

            else if(
                b.type==="wide" ||
                b.type==="noball" ||
                b.type==="extra"
            )
                cls+=" over-extra";

            else if(
                b.runs===4 ||
                b.runs===6
            )
                cls+=" over-four";


            return `
                <div class="${cls}">
                    ${escapeHtml(b.label)}
                </div>
            `;

        }).join("");


    container.classList.add("show");

}


/* =====================================================
   TOGGLE
===================================================== */

function toggle(id,state){

    const el =
        document.getElementById(id);

    if(!el) return;

    el.classList.toggle(
        "show",
        state === true
    );

    el.classList.toggle(
        "hidden",
        state !== true
    );

}


/* =====================================================
   HIDE
===================================================== */

function hideEverything(){

    [
        "scorebug",
        "currentOver",
        "batsman",
        "bowler",
        "lower",
        "sponsor",
        "announcement",
        "result",
        "matchInfo"

    ].forEach(id=>{

        const el =
            document.getElementById(id);

        if(el)
            el.classList.add("hidden");

    });

}


/* =====================================================
   HELPERS
===================================================== */

function setText(id,value){

    const el =
        document.getElementById(id);

    if(el)
        el.textContent =
            value ?? "";

}


function ballsToOvers(balls){

    balls =
        Number(balls || 0);

    return (
        Math.floor(balls/6) +
        "." +
        (balls%6)
    );

}


function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
