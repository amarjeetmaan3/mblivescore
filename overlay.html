<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MB Live Score — Overlay</title>
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Arial,sans-serif;color:#fff}
#score{position:absolute;left:40px;top:40px;display:none;font-weight:800;text-shadow:0 2px 4px #000}
#team{font-size:22px}.main{font-size:42px;line-height:1}.ov{font-size:20px;margin-left:8px}
#info{position:absolute;left:40px;top:115px;font-size:16px;text-shadow:0 2px 4px #000;display:none}
#lower{position:absolute;left:40px;bottom:50px;display:none;text-shadow:0 2px 4px #000}
#lower .name{font-size:24px;font-weight:700}#lower .sub{font-size:14px}
</style>
</head>
<body>
<div id="score"><span id="team"></span> <span class="main" id="runs">0-0</span><span class="ov" id="overs">(0.0)</span></div>
<div id="info"></div>
<div id="lower"><div class="name" id="striker"></div><div class="sub" id="bats"></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {getDatabase,ref,onValue} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";
const firebaseConfig={
 apiKey:"AIzaSyCgAURksaOv2NtQ9LeVHVoLj4RFtDs7PVY",
 authDomain:"mb-live-score.firebaseapp.com",
 databaseURL:"https://mb-live-score-default-rtdb.firebaseio.com",
 projectId:"mb-live-score",
 storageBucket:"mb-live-score.firebasestorage.app",
 messagingSenderId:"263955953168",
 appId:"1:263955953168:web:728d45ff569fdb0cad7c95"
};
const app=initializeApp(firebaseConfig),db=getDatabase(app);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
onValue(ref(db,"current_match"),snap=>{
 const s=snap.val(); if(!s){document.getElementById("score").style.display="none";document.getElementById("info").style.display="none";document.getElementById("lower").style.display="none";return}
 const i=s.innings[s.inningsNo-1], team=s.inningsNo===1?s.meta.teamA:s.meta.teamB;
 const showScore=s.graphic?.score!==false,showLower=s.graphic?.lowerThird!==false;
 document.getElementById("score").style.display=showScore?"block":"none";
 document.getElementById("team").textContent=team||"";
 document.getElementById("runs").textContent=`${i.runs}-${i.wickets}`;
 document.getElementById("overs").textContent=`(${i.overNo}.${i.legalBalls})`;
 document.getElementById("info").style.display=showScore?"block":"none";
 document.getElementById("info").textContent=`${s.meta.tournament||""} • ${s.meta.teamA||""} vs ${s.meta.teamB||""}`;
 document.getElementById("lower").style.display=showLower?"block":"none";
 const b=i.striker>=0?i.batting[i.striker]:null;
 document.getElementById("striker").textContent=b?b.name:"";
 document.getElementById("bats").textContent=b?`${b.runs} runs • ${b.balls} balls`:"";
});
</script>
</body>
</html>
