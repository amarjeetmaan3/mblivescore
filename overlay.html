<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Broadcast Renderer | Professional Scorebug</title>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 100vw; height: 100vh; background: transparent; overflow: hidden; font-family: 'Montserrat', sans-serif; color: #fff; }
  
  /* =====================================================
     SCOREBUG HIERARCHY & GLASSMORPHISM
  ===================================================== */
  .broadcast-safe-area { position: absolute; bottom: 50px; left: 50px; display: flex; flex-direction: column; filter: drop-shadow(0 15px 30px rgba(0,0,0,0.6)); }
  
  .horizontal-bar { display: flex; background: rgba(5, 10, 20, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; overflow: hidden; height: 60px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.1); }
  
  .team-zone { background: linear-gradient(135deg, #0ea5e9, #1e3a8a); font-family: 'Teko', sans-serif; font-size: 42px; font-weight: 700; padding: 0 25px; display: flex; align-items: center; border-right: 2px solid #fff; }
  
  .score-zone { display: flex; align-items: baseline; padding: 0 25px; background: rgba(0,0,0,0.4); border-right: 1px solid rgba(255,255,255,0.1); }
  .score-zone .runs { font-family: 'Teko', sans-serif; font-size: 55px; font-weight: 700; color: #facc15; line-height: 60px; }
  .score-zone .overs { font-size: 15px; font-weight: 800; color: #cbd5e1; margin-left: 10px; }
  
  .batsman-zone { display: flex; flex-direction: column; justify-content: center; padding: 0 20px; border-right: 1px solid rgba(255,255,255,0.1); min-width: 260px; gap: 2px; }
  .bat-row { display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; color: #94a3b8; }
  .bat-row.active { color: #fff; }
  .bat-row.active .b-name::after { content: ' ▶'; color: #facc15; font-size: 10px; }
  .b-stat { font-family: 'Teko', sans-serif; font-size: 20px; font-weight: 500; color: #facc15; letter-spacing: 1px; line-height: 1; }
  .bat-row:not(.active) .b-stat { color: #cbd5e1; }
  
  .bowler-zone { display: flex; flex-direction: column; justify-content: center; padding: 0 20px; min-width: 220px; border-right: 1px solid rgba(255,255,255,0.1); }
  .bw-title { font-size: 9px; color: #94a3b8; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; }
  .bw-name { font-size: 14px; font-weight: 800; color: #38bdf8; text-transform: uppercase; }
  .bw-stat { font-family: 'Teko', sans-serif; font-size: 22px; font-weight: 500; line-height: 1; margin-top: 2px; }
  
  .over-zone { display: flex; align-items: center; padding: 0 15px; gap: 4px; max-width: 250px; flex-wrap: wrap; }
  .ball { width: 24px; height: 24px; border-radius: 50%; background: #1e293b; color: #fff; font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 2px 5px rgba(255,255,255,0.2); }
  .ball.bound { background: #2563eb; } .ball.six { background: #059669; } .ball.wkt { background: #dc2626; }
  
  /* Chase & Target Strip */
  .chase-strip { display: none; background: #0ea5e9; color: #fff; font-size: 13px; font-weight: 900; padding: 6px 25px; border-radius: 0 0 6px 6px; text-transform: uppercase; letter-spacing: 1px; align-self: flex-start; margin-left: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
</style>
</head>
<body>

<div class="broadcast-safe-area">
  <div class="horizontal-bar">
    <div class="team-zone" id="ovTeam">IND</div>
    <div class="score-zone">
      <div class="runs" id="ovScore">0/0</div>
      <div class="overs" id="ovOvers">(0.0)</div>
    </div>
    
    <div class="batsman-zone">
      <div class="bat-row active" id="strRow">
        <span class="b-name" id="strName">BATSMAN 1</span>
        <span class="b-stat" id="strStats">0 (0)</span>
      </div>
      <div class="bat-row" id="nonStrRow">
        <span class="b-name" id="nonStrName">BATSMAN 2</span>
        <span class="b-stat" id="nonStrStats">0 (0)</span>
      </div>
    </div>
    
    <div class="bowler-zone">
      <span class="bw-title">BOWLING</span>
      <span class="bw-name" id="bwName">BOWLER 1</span>
      <span class="bw-stat" id="bwStats">0-0 <span style="font-size:14px; color:#94a3b8;">(0.0)</span> ECO: 0.00</span>
    </div>
    
    <div class="over-zone" id="ovBalls"></div>
  </div>
  
  <div class="chase-strip" id="chaseStrip">
    TARGET: <span id="tgtRuns">0</span> &nbsp;|&nbsp; NEED <span id="reqRuns">0</span> OFF <span id="reqBalls">0</span> &nbsp;|&nbsp; RRR <span id="reqRrr">0.00</span>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

// Same config as controller[cite: 1]
const firebaseConfig = {
  apiKey: "AIzaSyCgAURksaOv2NtQ9LeVHVoLj4RFtDs7PVY",
  authDomain: "mb-live-score.firebaseapp.com",
  databaseURL: "https://mb-live-score-default-rtdb.firebaseio.com",
  projectId: "mb-live-score"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

onValue(ref(db, "broadcast_state"), snap => {
  const state = snap.val();
  if(!state) return;
  
  const tBat = state.meta.batTeam; const tBowl = state.meta.bowlTeam;
  document.getElementById('ovTeam').innerText = state.meta[tBat === 'A' ? 'tA' : 'tB'];
  document.getElementById('ovScore').innerText = `${state.score}/${state.wickets}`;
  document.getElementById('ovOvers').innerText = `(${Math.floor(state.legalBalls/6)}.${state.legalBalls%6})`;
  
  // Players Data Hierarchy mapped accurately
  const striker = state.squads[tBat].find(p => p.id === state.striker);
  const nonStriker = state.squads[tBat].find(p => p.id === state.nonStriker);
  const bowler = state.squads[tBowl].find(p => p.id === state.bowler);
  
  if(striker) { document.getElementById('strName').innerText = striker.name; document.getElementById('strStats').innerText = `${striker.runs} (${striker.balls})`; }
  if(nonStriker) { document.getElementById('nonStrName').innerText = nonStriker.name; document.getElementById('nonStrStats').innerText = `${nonStriker.runs} (${nonStriker.balls})`; }
  if(bowler) { 
    document.getElementById('bwName').innerText = bowler.name; 
    const bOvs = `${Math.floor(bowler.bBalls/6)}.${bowler.bBalls%6}`;
    const bEco = bowler.bBalls > 0 ? ((bowler.bRuns/bowler.bBalls)*6).toFixed(2) : "0.00";
    document.getElementById('bwStats').innerHTML = `${bowler.bWkts}-${bowler.bRuns} <span style="font-size:14px; color:#94a3b8;">(${bOvs})</span> ECO: ${bEco}`; 
  }

  // Visual Over Strip
  document.getElementById('ovBalls').innerHTML = (state.overLog || []).map(b => {
    let cls = 'ball'; if(b===4) cls+=' bound'; else if(b===6) cls+=' six'; else if(b==='W') cls+=' wkt';
    return `<div class="${cls}">${b}</div>`;
  }).join('');

  // Target Logic
  const strip = document.getElementById('chaseStrip');
  if(state.target) {
    strip.style.display = "flex";
    document.getElementById('tgtRuns').innerText = state.target;
    const reqRuns = state.target - state.score; const reqBalls = (state.meta.maxOvers * 6) - state.legalBalls;
    document.getElementById('reqRuns').innerText = reqRuns > 0 ? reqRuns : 0;
    document.getElementById('reqBalls').innerText = reqBalls > 0 ? reqBalls : 0;
    document.getElementById('reqRrr').innerText = reqBalls > 0 ? ((reqRuns / reqBalls) * 6).toFixed(2) : "0.00";
  } else { strip.style.display = "none"; }
});
</script>
</body>
</html>
