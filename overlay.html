<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MB Live Studio — Broadcast Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 100vw; height: 100vh; background: transparent; overflow: hidden; font-family: 'Montserrat', sans-serif; }
  
  /* ================= MAIN SCOREBUG ================= */
  .scorebug {
    position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center;
    opacity: 0; transition: opacity 0.3s ease; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8));
  }
  .scorebug.show { opacity: 1; }
  
  .brand-bar { background: linear-gradient(90deg, #0ea5e9, #2563eb); color: #fff; font-size: 11px; padding: 3px 20px; font-weight: 900; border-radius: 4px 4px 0 0; align-self: flex-start; margin-left: 20px; letter-spacing: 2px; }
  
  .main-strip { display: flex; background: rgba(10, 15, 25, 0.95); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; backdrop-filter: blur(10px); overflow: hidden; height: 65px; }
  
  .team-block { background: #facc15; color: #000; font-family: 'Teko', sans-serif; font-size: 42px; font-weight: 700; padding: 0 25px; display: flex; align-items: center; }
  .score-block { display: flex; align-items: baseline; padding: 0 25px; color: #fff; border-right: 1px solid rgba(255,255,255,0.1); }
  .score-block .runs { font-family: 'Teko', sans-serif; font-size: 52px; font-weight: 700; line-height: 65px; }
  .score-block .overs { font-size: 16px; font-weight: 700; color: #94a3b8; margin-left: 10px; }
  
  .current-over { display: flex; align-items: center; padding: 0 15px; gap: 5px; }
  .ball-pill { width: 26px; height: 26px; border-radius: 50%; background: #1e293b; color: #fff; font-size: 11px; font-weight: bold; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.2); }
  
  /* ================= DYNAMIC BOTTOM STRIP ================= */
  .bottom-strip {
    background: #0ea5e9; color: #fff; font-size: 14px; font-weight: 900; text-transform: uppercase;
    padding: 6px 30px; border-radius: 0 0 6px 6px; letter-spacing: 1px; min-width: 400px; text-align: center;
    box-shadow: 0 5px 15px rgba(0,0,0,0.5); opacity: 0; transition: opacity 0.3s;
  }
  .bottom-strip.show { opacity: 1; }

  /* ================= POPUP EVENTS (4, 6, WICKET) ================= */
  .popup-event {
    position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0.5);
    background: rgba(10, 15, 25, 0.95); padding: 20px 60px; border: 2px solid #0ea5e9; border-radius: 12px;
    text-align: center; opacity: 0; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .popup-event.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .pop-title { font-family: 'Teko', sans-serif; font-size: 100px; font-weight: 700; color: #fff; line-height: 0.9; }
</style>
</head>
<body>

<div class="scorebug" id="scorebug">
  <div class="brand-bar">M.B. LIVE STUDIO</div>
  <div class="main-strip">
    <div class="team-block" id="ovTeam">IND</div>
    <div class="score-block">
      <div class="runs" id="ovScore">0/0</div>
      <div class="overs" id="ovOvers">(0.0)</div>
    </div>
    <div class="current-over" id="ovBalls"></div>
  </div>
  <div class="bottom-strip" id="bottomStrip"></div>
</div>

<div class="popup-event" id="popupEvent">
  <div class="pop-title" id="popTitle">WICKET</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCgAURksaOv2NtQ9LeVHVoLj4RFtDs7PVY",
  authDomain: "mb-live-score.firebaseapp.com",
  databaseURL: "https://mb-live-score-default-rtdb.firebaseio.com",
  projectId: "mb-live-score"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

onValue(ref(db, "current_match"), snap => {
  const state = snap.val();
  if(!state) { document.getElementById('scorebug').classList.remove('show'); return; }
  
  const g = state.graphics;
  
  // Main Scorebug Toggle
  if(g.scorebug) document.getElementById('scorebug').classList.add('show');
  else document.getElementById('scorebug').classList.remove('show');
  
  // Data Mapping
  const batTeamStr = state.meta.batTeam === 'A' ? state.meta.tA : state.meta.tB;
  document.getElementById('ovTeam').innerText = batTeamStr;
  document.getElementById('ovScore').innerText = `${state.score}/${state.wickets}`;
  document.getElementById('ovOvers').innerText = `(${Math.floor(state.legalBalls/6)}.${state.legalBalls%6})`;
  
  // Over Balls
  const ballsContainer = document.getElementById('ovBalls');
  ballsContainer.innerHTML = state.overBalls.map(b => {
    let color = "#1e293b";
    if(b === 4) color = "#2563eb";
    if(b === 6) color = "#9333ea";
    if(b === "W") color = "#ef4444";
    return `<div class="ball-pill" style="background:${color}">${b}</div>`;
  }).join('');
  
  // Bottom Strip (Dynamic Text)
  const bStrip = document.getElementById('bottomStrip');
  if(g.bottomStrip) { bStrip.classList.add('show'); bStrip.innerText = g.dynamicText || "M.B. LIVE STUDIO"; }
  else bStrip.classList.remove('show');
  
  // Event Popup
  const pop = document.getElementById('popupEvent');
  if(g.activeEvent) {
    document.getElementById('popTitle').innerText = g.activeEvent;
    pop.style.borderColor = g.activeEvent === "WICKET" ? "#ef4444" : "#0ea5e9";
    pop.classList.add('show');
  } else {
    pop.classList.remove('show');
  }
});
</script>
</body>
</html>
