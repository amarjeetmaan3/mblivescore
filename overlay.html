<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>M.B. Live Studio — Broadcast Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#050c18; --navy:#0a1628; --navy-2:#0f2140; --navy-3:#16304f;
    --gold:#d4af37; --gold-2:#f2d878; --crimson:#b91c1c; --crimson-2:#e13939;
    --ink:#f5f5f0; --muted:#8fa3bf; --line:rgba(212,175,55,0.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html,body { width: 100vw; height: 100vh; background: transparent; overflow: hidden; font-family: 'Rajdhani', sans-serif; color: var(--ink); }

  .num { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.5px; }
  .mark { font-family: 'Orbitron', sans-serif; }

  /* ================= MAIN SCOREBUG ================= */
  .scorebug {
    position: absolute; bottom: 46px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: stretch; min-width: 760px;
    opacity: 0; transition: opacity .35s ease; filter: drop-shadow(0 14px 28px rgba(0,0,0,0.65));
  }
  .scorebug.show { opacity: 1; }

  .brand-bar {
    align-self: flex-start; margin-left: 22px;
    background: var(--gold); color: var(--navy-deep);
    font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 11px;
    padding: 4px 16px; letter-spacing: 3px; border-radius: 5px 5px 0 0;
  }

  .main-strip {
    display: flex; align-items: stretch;
    background: linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    border: 1px solid var(--line); border-radius: 8px; overflow: hidden; height: 96px;
  }

  .team-block {
    background: var(--gold); color: var(--navy-deep);
    font-family: 'Bebas Neue', sans-serif; font-size: 34px; letter-spacing: 1px;
    padding: 0 22px; display: flex; align-items: center; border-right: 3px solid var(--crimson);
    min-width: 130px; justify-content: center; text-align: center;
  }

  .score-block { display: flex; align-items: baseline; padding: 0 22px; border-right: 1px solid var(--line); }
  .score-block .runs { font-family: 'Bebas Neue', sans-serif; font-size: 54px; line-height: 1; }
  .score-block .overs { font-size: 16px; font-weight: 700; color: var(--muted); margin-left: 10px; }

  .rate-block { display:flex; flex-direction:column; justify-content:center; padding: 0 18px; border-right: 1px solid var(--line); gap: 2px; }
  .rate-block .label { font-size: 10px; letter-spacing: 1.5px; color: var(--gold); font-weight: 700; }
  .rate-block .value { font-size: 20px; font-weight: 700; }

  .batters-block { display:flex; flex-direction:column; justify-content:center; padding: 0 18px; border-right: 1px solid var(--line); gap: 4px; min-width: 190px; }
  .batter-row { display:flex; justify-content: space-between; font-size: 14px; font-weight: 600; }
  .batter-row.on-strike { color: var(--gold-2); }
  .batter-row .fig { color: var(--muted); font-size: 12px; margin-left: 8px; }

  .bowler-block { display:flex; flex-direction:column; justify-content:center; padding: 0 18px; gap: 2px; min-width: 150px; }
  .bowler-block .label { font-size: 10px; letter-spacing: 1.5px; color: var(--gold); font-weight: 700; }
  .bowler-block .name { font-size: 14px; font-weight: 700; }
  .bowler-block .fig { font-size: 12px; color: var(--muted); }

  .over-track { display: flex; align-items: center; padding: 0 14px; gap: 4px; border-left: 1px solid var(--line); }
  .ball-pill { min-width: 22px; height: 22px; padding: 0 3px; border-radius: 50%; background: var(--navy-3); color: var(--ink); font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); }

  /* ================= BOTTOM STRIP ================= */
  .bottom-strip {
    background: linear-gradient(90deg, var(--crimson) 0%, var(--crimson-2) 100%); color: #fff;
    font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px;
    padding: 7px 26px; border-radius: 0 0 6px 6px; text-align: center;
    opacity: 0; transition: opacity .3s;
  }
  .bottom-strip.show { opacity: 1; }

  /* ================= PARTNERSHIP PANEL ================= */
  .partnership-panel {
    position: absolute; top: 44px; right: 44px; width: 300px;
    background: linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    border: 1px solid var(--line); border-radius: 8px; padding: 14px 18px;
    opacity: 0; transform: translateX(20px); transition: all .35s ease;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.6));
  }
  .partnership-panel.show { opacity: 1; transform: translateX(0); }
  .panel-title { font-size: 10px; letter-spacing: 2px; color: var(--gold); font-weight: 700; margin-bottom: 8px; }
  .partnership-num { font-family: 'Bebas Neue', sans-serif; font-size: 40px; color: var(--gold-2); }
  .partnership-sub { font-size: 12px; color: var(--muted); }

  /* ================= TARGET / COMPARISON PANEL ================= */
  .target-panel {
    position: absolute; top: 44px; left: 44px; width: 320px;
    background: linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    border: 1px solid var(--line); border-radius: 8px; padding: 14px 18px;
    opacity: 0; transform: translateX(-20px); transition: all .35s ease;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.6));
  }
  .target-panel.show { opacity: 1; transform: translateX(0); }
  .target-row { display:flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .target-row .k { font-size: 12px; color: var(--muted); }
  .target-row .v { font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: var(--ink); }
  .target-row .v.accent { color: var(--gold-2); }
  .compare-line { display:flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); }

  /* ================= POPUP EVENTS ================= */
  .popup-event {
    position: absolute; top: 38%; left: 50%; transform: translate(-50%, -50%) scale(0.5);
    background: radial-gradient(ellipse at center, var(--navy) 0%, var(--navy-deep) 100%);
    padding: 22px 70px; border: 3px solid var(--gold); border-radius: 14px;
    text-align: center; opacity: 0; transition: all .35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    filter: drop-shadow(0 18px 34px rgba(0,0,0,0.7));
  }
  .popup-event.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .pop-title { font-family: 'Bebas Neue', sans-serif; font-size: 96px; line-height: 0.9; color: #fff; letter-spacing: 2px; }
  .pop-sub { font-size: 13px; letter-spacing: 3px; color: var(--gold-2); margin-top: 6px; font-weight: 700; }

  /* ================= MILESTONE BANNER ================= */
  .milestone-banner {
    position: absolute; top: 22%; left: 50%; transform: translate(-50%, -30px);
    background: linear-gradient(90deg, var(--gold) 0%, var(--gold-2) 100%); color: var(--navy-deep);
    padding: 14px 50px; border-radius: 6px; text-align: center;
    opacity: 0; transition: all .4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    filter: drop-shadow(0 10px 22px rgba(0,0,0,0.6));
  }
  .milestone-banner.show { opacity: 1; transform: translate(-50%, 0); }
  .milestone-text { font-family: 'Orbitron', sans-serif; font-size: 28px; font-weight: 900; letter-spacing: 1px; }
</style>
</head>
<body>

<div class="scorebug" id="scorebug">
  <div class="brand-bar">M.B. LIVE STUDIO</div>
  <div class="main-strip">
    <div class="team-block" id="ovTeam">IND</div>
    <div class="score-block">
      <div class="runs num" id="ovScore">0/0</div>
      <div class="overs" id="ovOvers">(0.0)</div>
    </div>
    <div class="rate-block">
      <div class="label">CRR</div>
      <div class="value" id="ovCrr">0.00</div>
    </div>
    <div class="rate-block" id="ovRrrBlock" style="display:none;">
      <div class="label">RRR</div>
      <div class="value" id="ovRrr">0.00</div>
    </div>
    <div class="batters-block">
      <div class="batter-row" id="ovStrikerRow"><span id="ovStrikerName">—</span><span class="fig" id="ovStrikerFig"></span></div>
      <div class="batter-row" id="ovNonStrikerRow"><span id="ovNonStrikerName">—</span><span class="fig" id="ovNonStrikerFig"></span></div>
    </div>
    <div class="bowler-block">
      <div class="label">BOWLER</div>
      <div class="name" id="ovBowlerName">—</div>
      <div class="fig" id="ovBowlerFig">0-0-0-0</div>
    </div>
    <div class="over-track" id="ovBalls"></div>
  </div>
  <div class="bottom-strip" id="bottomStrip"></div>
</div>

<div class="partnership-panel" id="partnershipPanel">
  <div class="panel-title">CURRENT PARTNERSHIP</div>
  <div class="partnership-num num" id="partRuns">0</div>
  <div class="partnership-sub" id="partSub">off 0 balls</div>
</div>

<div class="target-panel" id="targetPanel">
  <div class="panel-title">TARGET</div>
  <div class="target-row"><span class="k">To Win</span><span class="v accent" id="tgtTarget">—</span></div>
  <div class="target-row"><span class="k">Need</span><span class="v" id="tgtNeed">—</span></div>
  <div class="target-row"><span class="k">From</span><span class="v" id="tgtBalls">—</span></div>
  <div class="compare-line"><span id="tgtCompare">—</span></div>
</div>

<div class="popup-event" id="popupEvent">
  <div class="pop-title num" id="popTitle">WICKET</div>
  <div class="pop-sub" id="popSub"></div>
</div>

<div class="milestone-banner" id="milestoneBanner">
  <div class="milestone-text mark" id="milestoneText">FIFTY!</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCgAURksaOv2NtQ9LeVHVoLj4RFtDs7PVY",
  authDomain: "mb-live-score.firebaseapp.com",
  databaseURL: "https://mb-live-score-default-rtdb.firebaseio.com",
  projectId: "mb-live-score"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let lastEventKey = null;
let lastMilestoneKey = null;

function fmtFig(bs) {
  if(!bs) return "0.0-0-0-0";
  const overs = `${Math.floor(bs.balls/6)}.${bs.balls%6}`;
  return `${overs}-${bs.runs}-${bs.wickets}`;
}

onValue(ref(db, "current_match"), snap => {
  const state = snap.val();
  const bug = document.getElementById('scorebug');
  if(!state) { bug.classList.remove('show'); document.getElementById('partnershipPanel').classList.remove('show'); document.getElementById('targetPanel').classList.remove('show'); return; }

  const g = state.graphics || {};
  const tBat = state.meta.batTeam, tBowl = state.meta.bowlTeam;
  const battingTeamName = tBat === 'A' ? state.meta.tA : state.meta.tB;

  // Main scorebug
  if(g.scorebug) bug.classList.add('show'); else bug.classList.remove('show');

  document.getElementById('ovTeam').innerText = battingTeamName;
  document.getElementById('ovScore').innerText = `${state.score}/${state.wickets}`;
  document.getElementById('ovOvers').innerText = `(${Math.floor(state.legalBalls/6)}.${state.legalBalls%6})`;
  document.getElementById('ovCrr').innerText = state.legalBalls > 0 ? ((state.score / state.legalBalls) * 6).toFixed(2) : "0.00";

  // Required run rate (2nd innings)
  const rrrBlock = document.getElementById('ovRrrBlock');
  if(state.innings === 2 && state.target != null) {
    const ballsLeft = (state.meta.maxOvers * 6) - state.legalBalls;
    const runsNeeded = state.target - state.score;
    rrrBlock.style.display = 'flex';
    document.getElementById('ovRrr').innerText = ballsLeft > 0 ? Math.max(0, (runsNeeded / ballsLeft) * 6).toFixed(2) : "—";
  } else {
    rrrBlock.style.display = 'none';
  }

  // Batters
  const striker = (state.squads[tBat] || []).find(p => p.id === state.striker);
  const nonStriker = (state.squads[tBat] || []).find(p => p.id === state.nonStriker);
  if(striker) {
    document.getElementById('ovStrikerName').innerText = `${striker.name}*`;
    document.getElementById('ovStrikerFig').innerText = `${striker.runs}(${striker.balls})`;
  }
  if(nonStriker) {
    document.getElementById('ovNonStrikerName').innerText = nonStriker.name;
    document.getElementById('ovNonStrikerFig').innerText = `${nonStriker.runs}(${nonStriker.balls})`;
  }

  // Bowler
  const bowler = (state.squads[tBowl] || []).find(p => p.id === state.bowler);
  const bStats = (state.bowlerStats || {})[state.bowler];
  document.getElementById('ovBowlerName').innerText = bowler ? bowler.name : "—";
  document.getElementById('ovBowlerFig').innerText = fmtFig(bStats);

  // Over balls
  const ballsContainer = document.getElementById('ovBalls');
  ballsContainer.innerHTML = (state.overBalls || []).map(b => {
    let color = "var(--navy-3)";
    if(b === 4) color = "var(--gold)";
    if(b === 6) color = "var(--crimson)";
    if(b === "W") color = "var(--crimson-2)";
    return `<div class="ball-pill" style="background:${color}">${b}</div>`;
  }).join('');

  // Bottom strip
  const bStrip = document.getElementById('bottomStrip');
  if(g.bottomStrip) { bStrip.classList.add('show'); bStrip.innerText = g.dynamicText || "M.B. LIVE STUDIO"; }
  else bStrip.classList.remove('show');

  // Partnership panel
  const partPanel = document.getElementById('partnershipPanel');
  if(g.partnership && state.partnership) {
    partPanel.classList.add('show');
    document.getElementById('partRuns').innerText = state.partnership.runs;
    document.getElementById('partSub').innerText = `off ${state.partnership.balls} balls`;
  } else partPanel.classList.remove('show');

  // Target / comparison panel
  const tgtPanel = document.getElementById('targetPanel');
  if(g.target && state.innings === 2 && state.target != null) {
    tgtPanel.classList.add('show');
    const ballsLeft = (state.meta.maxOvers * 6) - state.legalBalls;
    const runsNeeded = Math.max(0, state.target - state.score);
    document.getElementById('tgtTarget').innerText = state.target;
    document.getElementById('tgtNeed').innerText = `${runsNeeded} runs`;
    document.getElementById('tgtBalls').innerText = `${ballsLeft} balls`;
    if(state.firstInnings) {
      document.getElementById('tgtCompare').innerText = `1st Inns: ${state.firstInnings.team === 'A' ? state.meta.tA : state.meta.tB} ${state.firstInnings.score}/${state.firstInnings.wickets}`;
    }
  } else tgtPanel.classList.remove('show');

  // Event popup (FOUR/SIX/WICKET)
  const pop = document.getElementById('popupEvent');
  if(g.activeEvent) {
    document.getElementById('popTitle').innerText = g.activeEvent === "WICKET" ? "OUT!" : g.activeEvent;
    document.getElementById('popSub').innerText = g.activeEvent === "WICKET" ? (striker ? `${striker.name}` : "") : battingTeamName;
    pop.style.borderColor = g.activeEvent === "WICKET" ? "var(--crimson)" : "var(--gold)";
    pop.classList.add('show');
  } else {
    pop.classList.remove('show');
  }

  // Milestone banner (50s/100s/5-wicket haul)
  const mBanner = document.getElementById('milestoneBanner');
  if(g.milestoneEvent) {
    document.getElementById('milestoneText').innerText = g.milestoneEvent;
    mBanner.classList.add('show');
  } else {
    mBanner.classList.remove('show');
  }
});
</script>
</body>
</html>
