name: Cricbuzz Fetch Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/test_fetch.py'
      - '.github/workflows/test.yml'
      - '.github/workflows/sync-cricbuzz.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/test_fetch.py'
      - '.github/workflows/test.yml'
      - '.github/workflows/sync-cricbuzz.yml'

permissions:
  contents: read

jobs:
  smoke:
    name: Validate and inspect Cricbuzz data without writing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Validate Python syntax
        run: python -m py_compile scripts/test_fetch.py
      - name: Fetch configured match once (read-only diagnostic)
        run: python scripts/test_fetch.py
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          CRICBUZZ_ONCE: '1'
          CRICBUZZ_DRY_RUN: '1'
