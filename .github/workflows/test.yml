name: Test Fetch

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python scripts/test_fetch.py
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
