name: Test Fetch

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
            - run: python scripts/test_fetch.py
      - uses: actions/upload-artifact@v4
        with:
          name: output-html
          path: output.html
