<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.B. Live Studio - Controller</title>

    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            background: #e0e0e0;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 400px;
            margin: auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        input {
            width: 90%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 95%;
            padding: 12px;
            background: #d32f2f;
            color: white;
            border: none;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }

        button:active {
            background: #b71c1c;
        }

        #status {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="card">

    <h3 style="text-align: center;">
        M.B. Live Studio - Controller
    </h3>

    <label>Batting Team:</label><br>
    <input type="text" id="teamName" value="TEAM A"><br>

    <label>Runs:</label><br>
    <input type="number" id="runs" value="0"><br>

    <label>Wickets:</label><br>
    <input type="number" id="wickets" value="0"><br>

    <label>Overs:</label><br>
    <input type="text" id="overs" value="0.0"><br>

    <label>Situation/Message:</label><br>
    <input type="text" id="situation" value="Powerplay 1"><br>

    <button id="updateBtn">
        Update Live Score
    </button>

    <div id="status">
        Ready
    </div>

</div>

<script type="module">

    // Firebase SDK
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";

    import {
        getDatabase,
        ref,
        set
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";


    // =====================================================
    // MBTOAJ FIREBASE PROJECT
    // =====================================================

    const firebaseConfig = {

        apiKey: "AIzaSyAVo8B0n12e13eJJMjsh4U9zWUuoqaLnbM",

        authDomain: "mbtoaj.firebaseapp.com",

        databaseURL: "https://mbtoaj-default-rtdb.firebaseio.com",

        projectId: "mbtoaj",

        storageBucket: "mbtoaj.firebasestorage.app",

        messagingSenderId: "100171222080",

        appId: "1:100171222080:web:b7b90f66affc8561b8e3a5"

    };


    // Initialize Firebase
    const app = initializeApp(firebaseConfig);

    // Initialize Realtime Database
    const db = getDatabase(app);


    // =====================================================
    // UPDATE LIVE MATCH
    // =====================================================

    document
        .getElementById("updateBtn")
        .addEventListener("click", async () => {

            const team = document
                .getElementById("teamName")
                .value;

            const score = document
                .getElementById("runs")
                .value;

            const wickets = document
                .getElementById("wickets")
                .value;

            const overs = document
                .getElementById("overs")
                .value;

            const situation = document
                .getElementById("situation")
                .value;


            const liveMatchData = {

                team: team,

                score: score,

                wickets: wickets,

                overs: overs,

                situation: situation,

                updatedAt: Date.now()

            };


            try {

                await set(
                    ref(db, "live_match"),
                    liveMatchData
                );

                document
                    .getElementById("status")
                    .textContent =
                    "LIVE DATA UPDATED ✓";

            }

            catch (error) {

                console.error(error);

                document
                    .getElementById("status")
                    .textContent =
                    "ERROR: " + error.message;

            }

        });

</script>

</body>
</html>
