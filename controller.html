<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MB Live Studio - Control Room</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
  /* COMPACT & PROFESSIONAL BROADCAST UI */
  * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; font-size: 12px; }
  body { margin: 0; background: #070b10; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  
  /* Inputs & Buttons */
  button, input, select { outline: none; border: 1px solid #1e293b; background: #0f172a; color: #fff; padding: 6px 10px; border-radius: 4px; }
  button { font-weight: 700; cursor: pointer; transition: 0.1s; display: flex; align-items: center; justify-content: center; gap: 5px; }
  button:active { transform: scale(0.95); }
  select, input { padding: 4px 8px; }
  
  /* Colors */
  .btn-green { background: #059669; border-color: #047857; }
  .btn-red { background: #dc2626; border-color: #b91c1c; }
  .btn-blue { background: #2563eb; border-color: #1d4ed8; }
  .btn-purple { background: #7c3aed; border-color: #6d28d9; }
  .btn-dark { background: #1e293b; border-color: #334155; }
  .btn-graphic { background: #0f172a; border-color: #334155; color: #94a3b8; justify-content: flex-start; padding: 8px 12px; }
  .btn-graphic.active { background: #0284c7; border-color: #0369a1; color: #fff; }

  /* Layout */
  .header { background: #020617; padding: 10px 15px; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; }
  .header h2 { margin: 0; font-size: 16px; color: #38bdf8; font-weight: 900; letter-spacing: 1px; }
  
  .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; padding: 10px; height: calc(100vh - 40px); overflow-y: auto; }
  
  .panel { background: #0b1120; border: 1px solid #1e293b; border-radius: 6px; display: flex; flex-direction: column; }
  .panel-head { background: #0f172a; padding: 6px 10px; font-weight: 800; font-size: 11px; color: #94a3b8; border-bottom: 1px solid #1e293b; text-transform: uppercase; display: flex; justify-content: space-between; }
  .panel-body { padding: 10px; display: flex; flex-direction: column; gap: 10px; }

  /* Grids */
  .g-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .g-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .g-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  
  /* HUD */
  .hud-box { display: flex; justify-content: space-between; background: #0284c7; padding: 10px; border-radius: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
  .hud-score { font-size: 24px; font-weight: 900; line-height: 1; margin: 4px 0; }
  
  /* Timeline */
  .timeline { flex: 1; overflow-y: auto; background: #020617; border-radius: 4px; border: 1px solid #1e293b; }
  .tl-item { display: flex; justify-content: space-between; padding: 6px; border-bottom: 1px solid #1e293b; font-size: 11px; align-items: center; }
  .tl-item button { padding: 2px 6px; font-size: 9px; background: #334155; }
  
  /* Screens & Modals */
  .screen { display: none; } .screen.active { display: block; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 100; }
  .modal-bg.active { display: flex; }
  .modal { background: #0f172a; padding: 15px; border-radius: 6px; width: 300px; border: 1px solid #1e293b; }

  /* Keypad Adjustments */
  .score-btn { height: 35px; font-size: 14px; font-weight: 900; background: #1e293b; border-color: #334155; }
  .score-btn.b4 { background: #1d4ed8; border-color: #1e40af; }
  .score-btn.b6 { background: #059669; border-color: #047857; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <h2>M.B. LIVE STUDIO | CONTROL ROOM</h2>
  <div id="connStatus" style="color:#10b981; font-weight:bold; font-size:11px;">🟢 SYNCED</div>
</div>

<!-- ================= 1. START / LOAD SCREEN ================= -->
<div id="screen-home" class="screen active" style="padding: 20px; max-width: 800px; margin: 0 auto;">
  <div class="g-2">
    <!-- Load Match -->
    <div class="panel">
      <div class="panel-head">Load Saved Match</div>
      <div class="panel-body" id="savedMatchesList" style="max-height:300px; overflow-y:auto;"></div>
    </div>
    <!-- Create Match -->
    <div class="panel">
      <div class="panel-head">Create New Match</div>
      <div class="panel-body">
        <div class="g-2">
          <div><label>Team A</label><input type="text" id="tA_name" value="IND"></div>
          <div><label>Team B</label><input type="text" id="tB_name" value="AUS"></div>
          <div><label>Squad Size</label><input type="number" id="squadSize" value="11" min="2"></div>
          <div><label>Max Overs</label><input type="number" id="maxOvers" value="20" min="1"></div>
        </div>
        <label>Toss Result</label>
        <select id="tossWinner"><option value="A">Team A Won</option><option value="B">Team B Won</option></select>
        <select id="tossDecision"><option value="BAT">Elected to BAT</option><option value="BOWL">Elected to BOWL</option></select>
        <button class="btn-green" style="margin-top:10px; padding:10px;" onclick="createNewMatch()">START MATCH</button>
      </div>
    </div>
  </div>
</div>

<!-- ================= 2. LIVE DASHBOARD ================= -->
<div id="screen-live" class="screen dashboard">
  
  <!-- COLUMN 1: Management -->
  <div class="panel">
    <div class="panel-head">MATCH STATUS <button class="btn-red" style="padding:2px 6px; font-size:9px;" onclick="exitToHome()">EXIT</button></div>
    <div class="panel-body">
      <div class="hud-box">
        <div>
          <div id="hudTeam" style="font-size:11px; font-weight:800; color:#e0f2fe;">TEAM</div>
          <div class="hud-score"><span id="hudRuns">0</span>/<span id="hudWickets">0</span></div>
          <div style="font-size:11px; font-weight:bold;">Overs: <span id="hudOvers">0.0</span></div>
        </div>
        <div style="text-align: right; font-size:11px;">
          <div>CRR: <span id="hudCrr">0.00</span></div>
          <div style="margin-top:4px; color:#fde047; font-weight:bold;">Target: <span id="hudTarget">—</span></div>
          <div style="margin-top:4px;">Partner: <span id="hudPart">0 (0)</span></div>
        </div>
      </div>
      
      <div style="border-top:1px solid #1e293b; padding-top:10px; margin-top:5px;">
        <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
          <b style="color:#94a3b8; font-size:11px;">ON CREASE</b>
          <button class="btn-blue" style="padding:2px 6px; font-size:9px;" onclick="swapStrike()">SWAP STRIKE</button>
        </div>
        <div class="g-2">
          <div><label style="color:#38bdf8; font-size:10px;">Striker *</label><select id="strikerSelect" onchange="manualPlayerChange()"></select></div>
          <div><label style="color:#94a3b8; font-size:10px;">Non-Striker</label><select id="nonStrikerSelect" onchange="manualPlayerChange()"></select></div>
        </div>
        <div style="margin-top:6px;"><label style="color:#facc15; font-size:10px;">Bowler</label><select id="bowlerSelect" onchange="manualPlayerChange()"></select></div>
      </div>
    </div>
  </div>

  <!-- COLUMN 2: Scoring Engine -->
  <div class="panel">
    <div class="panel-head">SCORE CONTROL</div>
    <div class="panel-body">
      <div class="g-4">
        <button class="score-btn" onclick="processBall(0)">0</button>
        <button class="score-btn" onclick="processBall(1)">1</button>
        <button class="score-btn" onclick="processBall(2)">2</button>
        <button class="score-btn" onclick="processBall(3)">3</button>
        <button class="score-btn b4" onclick="processBall(4)" style="grid-column: span 2;">4</button>
        <button class="score-btn b6" onclick="processBall(6)" style="grid-column: span 2;">6</button>
      </div>
      
      <div class="g-4" style="margin-top:5px;">
        <button class="btn-dark" onclick="openExtraModal('WD')">WD</button>
        <button class="btn-dark" onclick="openExtraModal('NB')">NB</button>
        <button class="btn-dark" onclick="openExtraModal('B')">BYE</button>
        <button class="btn-dark" onclick="openExtraModal('LB')">LB</button>
      </div>

      <div class="g-2" style="margin-top:5px;">
        <button class="btn-red" style="height:35px;" onclick="openWicketModal('CAUGHT')">CAUGHT</button>
        <button class="btn-red" style="height:35px;" onclick="openWicketModal('RUN_OUT')">RUN OUT</button>
        <button class="btn-red" style="height:35px;" onclick="processWicket('BOWLED')">BOWLED</button>
        <button class="btn-red" style="height:35px;" onclick="openWicketModal('STUMPED')">STUMPED</button>
      </div>
      
      <div style="border-top:1px solid #1e293b; padding-top:10px; margin-top:5px; flex:1; display:flex; flex-direction:column;">
        <b style="color:#94a3b8; font-size:11px; margin-bottom:5px;">DEEP UNDO TIMELINE</b>
        <div class="timeline" id="timelineList"></div>
      </div>
    </div>
  </div>

  <!-- COLUMN 3: Graphics Controller -->
  <div class="panel">
    <div class="panel-head">BROADCAST GRAPHICS</div>
    <div class="panel-body" style="overflow-y:auto;">
      <b style="color:#94a3b8; font-size:11px;">OVERLAYS (TOGGLE)</b>
      <div class="g-2">
        <button class="btn-graphic" id="gfx_scorebug" onclick="toggleGraphic('scorebug')"><i class="fas fa-tv"></i> Scorebug</button>
        <button class="btn-graphic" id="gfx_partnership" onclick="toggleGraphic('partnership')"><i class="fas fa-handshake"></i> Partnership</button>
        <button class="btn-graphic" id="gfx_battingCard" onclick="toggleGraphic('battingCard')"><i class="fas fa-clipboard-list"></i> Batting Card</button>
        <button class="btn-graphic" id="gfx_bowlingCard" onclick="toggleGraphic('bowlingCard')"><i class="fas fa-baseball-ball"></i> Bowling Card</button>
        <button class="btn-graphic" id="gfx_bottomStrip" onclick="toggleGraphic('bottomStrip')"><i class="fas fa-bullhorn"></i> Info Strip</button>
      </div>

      <b style="color:#94a3b8; font-size:11px; margin-top:10px;">MANUAL POPUPS</b>
      <div class="g-3">
        <button class="btn-blue" style="padding:10px 0;" onclick="triggerAutoGraphic('FOUR')">FOUR</button>
        <button class="btn-green" style="padding:10px 0;" onclick="triggerAutoGraphic('SIX')">SIX</button>
        <button class="btn-red" style="padding:10px 0;" onclick="triggerAutoGraphic('WICKET')">WICKET</button>
        <button class="btn-dark" style="padding:10px 0;" onclick="triggerAutoGraphic('FIFTY')">50</button>
        <button class="btn-dark" style="padding:10px 0;" onclick="triggerAutoGraphic('HUNDRED')">100</button>
      </div>
    </div>
  </div>

</div>

<!-- ================= MODALS ================= -->
<!-- Extra Modal -->
<div class="modal-bg" id="extraModal">
  <div class="modal">
    <h3 id="extraTitle" style="margin-top:0; color:#38bdf8;">Extra Ball</h3>
    <label style="color:#94a3b8; font-size:11px;">Runs completed by batsmen on this extra?</label>
    <input type="number" id="extraRunsInput" value="0" min="0" style="width:100%; font-size:20px; text-align:center; margin:10px 0;">
    <div class="g-2">
      <button class="btn-green" onclick="submitExtra()">SUBMIT</button>
      <button class="btn-dark" onclick="closeModal('extraModal')">CANCEL</button>
    </div>
  </div>
</div>

<!-- Wicket Modal -->
<div class="modal-bg" id="wicketModal">
  <div class="modal">
    <h3 id="wicketTitle" style="margin-top:0; color:#ef4444;">Wicket</h3>
    <label style="color:#94a3b8; font-size:11px;">Who is Out?</label>
    <select id="outBatterSelect" style="width:100%; margin:5px 0 10px 0;"><option value="STRIKER">Striker</option><option value="NON_STRIKER">Non-Striker</option></select>
    <label style="color:#94a3b8; font-size:11px;">Fielder/Keeper</label>
    <select id="fielderSelect" style="width:100%; margin:5px 0 15px 0;"></select>
    <div class="g-2">
      <button class="btn-red" onclick="submitWicket()">OUT</button>
      <button class="btn-dark" onclick="closeModal('wicketModal')">CANCEL</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCgAURksaOv2NtQ9LeVHVoLj4RFtDs7PVY",
  authDomain: "mb-live-score.firebaseapp.com",
  databaseURL: "https://mb-live-score-default-rtdb.firebaseio.com",
  projectId: "mb-live-score"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const liveRef = ref(db, "current_match");

window.state = null;
window.timelineHistory = [];
window.tempExtraType = "";
window.tempWicketType = "";

function initApp() { renderSavedMatches(); }

// ================= SETUP & LOAD =================
window.createNewMatch = function() {
  const tA = document.getElementById('tA_name').value;
  const tB = document.getElementById('tB_name').value;
  const squadSize = parseInt(document.getElementById('squadSize').value);
  const maxOvers = parseInt(document.getElementById('maxOvers').value);
  const tossW = document.getElementById('tossWinner').value;
  const tossD = document.getElementById('tossDecision').value;
  
  let batTeam = (tossW === "A" && tossD === "BAT") || (tossW === "B" && tossD === "BOWL") ? "A" : "B";
  let bowlTeam = batTeam === "A" ? "B" : "A";

  // INJECTED LOGIC: Added individual runs, balls, fours, sixes for Scorecard sync.
  let rosterA = Array.from({length: squadSize}, (_, i) => ({ id: `A${i+1}`, name: `${tA} Player ${i+1}`, isOut: false, runs: 0, balls: 0, fours: 0, sixes: 0, bowlRuns: 0, bowlBalls: 0, wickets: 0 }));
  let rosterB = Array.from({length: squadSize}, (_, i) => ({ id: `B${i+1}`, name: `${tB} Player ${i+1}`, isOut: false, runs: 0, balls: 0, fours: 0, sixes: 0, bowlRuns: 0, bowlBalls: 0, wickets: 0 }));

  state = {
    id: "MB_" + Date.now(), title: `${tA} vs ${tB}`,
    meta: { tA, tB, squadSize, maxOvers, batTeam, bowlTeam },
    squads: { A: rosterA, B: rosterB },
    score: 0, wickets: 0, legalBalls: 0, overBalls: [], target: null,
    partnershipRuns: 0, partnershipBalls: 0,
    striker: rosterA[0].id, nonStriker: rosterA[1].id, bowler: rosterB[0].id, lastBowler: null,
    graphics: { scorebug: true, partnership: false, battingCard: false, bowlingCard: false, bottomStrip: true, dynamicText: "M.B. LIVE STUDIO", activeEvent: null }
  };
  if(batTeam === "B"){ state.striker = rosterB[0].id; state.nonStriker = rosterB[1].id; state.bowler = rosterA[0].id; }

  timelineHistory = [];
  saveMatchLocal(); startLiveController();
};

window.renderSavedMatches = function() {
  const list = document.getElementById('savedMatchesList');
  const matches = JSON.parse(localStorage.getItem('mb_saved_matches') || '[]');
  if(matches.length === 0) { list.innerHTML = "<div style='color:#94a3b8; font-size:11px;'>No saved matches.</div>"; return; }
  list.innerHTML = matches.map(m => `
    <div style="display:flex; justify-content:space-between; background:#1e293b; padding:8px; border-radius:4px; margin-bottom:6px; align-items:center;">
      <div><b style="color:#fff; font-size:12px;">${m.title}</b><div style="font-size:9px; color:#94a3b8;">Score: ${m.score}/${m.wickets}</div></div>
      <div style="display:flex; gap:5px;">
        <button class="btn-green" style="font-size:9px; padding:4px;" onclick="loadMatch('${m.id}')">LOAD</button>
        <button class="btn-red" style="font-size:9px; padding:4px;" onclick="deleteMatch('${m.id}')">DEL</button>
      </div>
    </div>
  `).join('');
};

window.loadMatch = function(id) {
  const matches = JSON.parse(localStorage.getItem('mb_saved_matches') || '[]');
  const m = matches.find(x => x.id === id);
  if(m) { state = m; timelineHistory = JSON.parse(localStorage.getItem(`mb_timeline_${id}`) || '[]'); startLiveController(); }
};

window.deleteMatch = function(id) {
  let matches = JSON.parse(localStorage.getItem('mb_saved_matches') || '[]');
  matches = matches.filter(x => x.id !== id);
  localStorage.setItem('mb_saved_matches', JSON.stringify(matches));
  localStorage.removeItem(`mb_timeline_${id}`);
  renderSavedMatches();
};

window.saveMatchLocal = function() {
  if(!state) return;
  let matches = JSON.parse(localStorage.getItem('mb_saved_matches') || '[]');
  const idx = matches.findIndex(x => x.id === state.id);
  if(idx > -1) matches[idx] = state; else matches.unshift(state);
  localStorage.setItem('mb_saved_matches', JSON.stringify(matches));
  localStorage.setItem(`mb_timeline_${state.id}`, JSON.stringify(timelineHistory));
  set(liveRef, state);
};

window.exitToHome = function() {
  document.getElementById('screen-live').classList.remove('active');
  document.getElementById('screen-home').classList.add('active');
  set(liveRef, null); renderSavedMatches();
};

function startLiveController() {
  document.getElementById('screen-home').classList.remove('active');
  document.getElementById('screen-live').classList.add('active');
  updateUI();
}

// ================= CORE SCORING & STATS UPDATE =================
function pushSnapshot(desc) {
  timelineHistory.unshift({ id: Date.now(), desc: desc, snapshot: JSON.stringify(state) });
  if(timelineHistory.length > 40) timelineHistory.pop();
}

window.undoToSnapshot = function(id) {
  const idx = timelineHistory.findIndex(x => x.id === id);
  if(idx > -1) {
    state = JSON.parse(timelineHistory[idx].snapshot);
    timelineHistory.splice(0, idx + 1);
    saveMatchLocal(); updateUI();
  }
};

window.processBall = function(runs) {
  if(checkAllOut()) return;
  pushSnapshot(`Score ${runs} runs`);
  
  state.score += runs; state.legalBalls += 1; state.overBalls.push(runs);
  
  // INJECTED LOGIC: Update individual player stats
  const tBat = state.meta.batTeam; const tBowl = state.meta.bowlTeam;
  const striker = state.squads[tBat].find(p => p.id === state.striker);
  const bowler = state.squads[tBowl].find(p => p.id === state.bowler);
  
  if(striker) { striker.runs += runs; striker.balls += 1; if(runs===4) striker.fours++; if(runs===6) striker.sixes++; }
  if(bowler) { bowler.bowlRuns += runs; bowler.bowlBalls += 1; }
  
  state.partnershipRuns = (state.partnershipRuns || 0) + runs;
  state.partnershipBalls = (state.partnershipBalls || 0) + 1;
  
  if(runs % 2 !== 0) swapStrikeInternal();
  checkOver();
  if(runs === 4) triggerAutoGraphic("FOUR"); if(runs === 6) triggerAutoGraphic("SIX");
  finalizeAction();
};

window.openExtraModal = function(type) {
  tempExtraType = type;
  document.getElementById('extraTitle').innerText = type;
  document.getElementById('extraRunsInput').value = 0;
  document.getElementById('extraModal').classList.add('active');
};

window.submitExtra = function() {
  const extraRuns = parseInt(document.getElementById('extraRunsInput').value) || 0;
  closeModal('extraModal');
  if(checkAllOut()) return;
  pushSnapshot(`Extra: ${tempExtraType} + ${extraRuns}`);
  
  const tBat = state.meta.batTeam; const tBowl = state.meta.bowlTeam;
  const striker = state.squads[tBat].find(p => p.id === state.striker);
  const bowler = state.squads[tBowl].find(p => p.id === state.bowler);

  let isLegal = (tempExtraType === 'B' || tempExtraType === 'LB');
  let penalty = (tempExtraType === 'WD' || tempExtraType === 'NB') ? 1 : 0;
  let totalRuns = extraRuns + penalty;
  
  state.score += totalRuns;
  state.overBalls.push(`${tempExtraType}${extraRuns>0 ? '+'+extraRuns : ''}`);
  
  // Update Bowler/Batter Extras logic
  if(!isLegal && bowler) bowler.bowlRuns += totalRuns;
  if(isLegal) {
      if(bowler) bowler.bowlBalls += 1;
      if(striker) striker.balls += 1;
      state.legalBalls += 1;
  }
  
  state.partnershipRuns = (state.partnershipRuns || 0) + totalRuns;
  if(isLegal) state.partnershipBalls = (state.partnershipBalls || 0) + 1;
  
  if(extraRuns % 2 !== 0) swapStrikeInternal();
  if(isLegal) checkOver();
  finalizeAction();
};

window.openWicketModal = function(type) {
  tempWicketType = type; document.getElementById('wicketTitle').innerText = type.replace('_', ' ');
  const fieldTeam = state.meta.bowlTeam; const select = document.getElementById('fielderSelect');
  select.innerHTML = '<option value="">-- Select Fielder --</option>';
  state.squads[fieldTeam].forEach(p => { select.innerHTML += `<option value="${p.id}">${p.name}</option>`; });
  document.getElementById('wicketModal').classList.add('active');
};

window.submitWicket = function() {
  const who = document.getElementById('outBatterSelect').value;
  const fielder = document.getElementById('fielderSelect').value;
  if(!fielder) { alert("Select Fielder"); return; }
  closeModal('wicketModal'); processWicket(tempWicketType, who, fielder);
};

window.processWicket = function(type, who = "STRIKER", fielderId = null) {
  if(checkAllOut()) return;
  pushSnapshot(`WICKET: ${type}`);
  
  state.wickets += 1; state.legalBalls += 1; state.overBalls.push('W');
  
  const batTeam = state.meta.batTeam; const bowlTeam = state.meta.bowlTeam;
  const outId = who === "STRIKER" ? state.striker : state.nonStriker;
  
  const pIdx = state.squads[batTeam].findIndex(p => p.id === outId);
  if(pIdx > -1) { state.squads[batTeam][pIdx].isOut = true; state.squads[batTeam][pIdx].balls += 1; }
  
  const bowler = state.squads[bowlTeam].find(p => p.id === state.bowler);
  if(bowler) { bowler.bowlBalls += 1; if(type !== 'RUN_OUT') bowler.wickets += 1; }
  
  // Reset Partnership
  state.partnershipRuns = 0; state.partnershipBalls = 0;
  
  // New Batter Assign
  const nextBatter = state.squads[batTeam].find(p => !p.isOut && p.id !== state.striker && p.id !== state.nonStriker);
  if(who === "STRIKER" && nextBatter) state.striker = nextBatter.id;
  else if (nextBatter) state.nonStriker = nextBatter.id;
  
  checkOver(); triggerAutoGraphic("WICKET"); finalizeAction();
};

function checkAllOut() {
  if (state.wickets >= state.meta.squadSize - 1) { alert("All Out!"); return true; }
  return false;
}

function swapStrikeInternal() { const t = state.striker; state.striker = state.nonStriker; state.nonStriker = t; }
window.swapStrike = function() { pushSnapshot("Swap Strike"); swapStrikeInternal(); finalizeAction(); };

function checkOver() {
  if(state.legalBalls % 6 === 0 && state.legalBalls > 0) {
    swapStrikeInternal(); state.lastBowler = state.bowler;
    const fieldTeam = state.meta.bowlTeam;
    const nextBowler = state.squads[fieldTeam].find(p => p.id !== state.lastBowler);
    if(nextBowler) state.bowler = nextBowler.id;
    state.overBalls = [];
  }
}

window.closeModal = function(id) { document.getElementById(id).classList.remove('active'); };

window.toggleGraphic = function(key) { state.graphics[key] = !state.graphics[key]; saveMatchLocal(); updateUI(); };
window.triggerAutoGraphic = function(type) { if(!type) return; state.graphics.activeEvent = type; set(liveRef, state); setTimeout(() => { state.graphics.activeEvent = null; set(liveRef, state); }, 4000); };
window.manualPlayerChange = function() { state.striker = document.getElementById('strikerSelect').value; state.nonStriker = document.getElementById('nonStrikerSelect').value; state.bowler = document.getElementById('bowlerSelect').value; saveMatchLocal(); };
function finalizeAction() { saveMatchLocal(); updateUI(); }

function updateUI() {
  if(!state) return;
  const tBat = state.meta.batTeam; const tBowl = state.meta.bowlTeam;
  document.getElementById('hudTeam').innerText = state.meta[tBat === 'A' ? 'tA' : 'tB'];
  document.getElementById('hudRuns').innerText = state.score;
  document.getElementById('hudWickets').innerText = state.wickets;
  document.getElementById('hudOvers').innerText = `${Math.floor(state.legalBalls/6)}.${state.legalBalls%6}`;
  document.getElementById('hudCrr').innerText = state.legalBalls > 0 ? ((state.score / state.legalBalls) * 6).toFixed(2) : "0.00";
  document.getElementById('hudPart').innerText = `${state.partnershipRuns} (${state.partnershipBalls})`;
  
  const sSel = document.getElementById('strikerSelect'); const nsSel = document.getElementById('nonStrikerSelect');
  sSel.innerHTML = state.squads[tBat].filter(p => !p.isOut).map(p => `<option value="${p.id}" ${state.striker===p.id?'selected':''}>${p.name}</option>`).join('');
  nsSel.innerHTML = state.squads[tBat].filter(p => !p.isOut).map(p => `<option value="${p.id}" ${state.nonStriker===p.id?'selected':''}>${p.name}</option>`).join('');
  
  const bSel = document.getElementById('bowlerSelect');
  bSel.innerHTML = state.squads[tBowl].filter(p => p.id !== state.lastBowler).map(p => `<option value="${p.id}" ${state.bowler===p.id?'selected':''}>${p.name}</option>`).join('');

  document.querySelectorAll('.btn-graphic').forEach(btn => {
    const key = btn.id.replace('gfx_', '');
    if(state.graphics[key]) btn.classList.add('active'); else btn.classList.remove('active');
  });

  const tl = document.getElementById('timelineList');
  tl.innerHTML = timelineHistory.map(t => `<div class="tl-item"><span>${t.desc}</span><button onclick="undoToSnapshot(${t.id})">↶ UNDO</button></div>`).join('');
}
initApp();
</script>
</body>
</html>
