<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MB Live Studio - Controller</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
  * { box-sizing: border-box; font-family: Arial, sans-serif; }
  body { margin: 0; background: #0b0f14; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  button, input, select { outline: none; border: 1px solid #303944; background: #111820; color: #fff; padding: 10px; border-radius: 6px; }
  button { font-weight: bold; cursor: pointer; transition: 0.1s; display: flex; align-items: center; justify-content: center; gap: 5px; }
  button:active { transform: scale(0.96); }
  .btn-primary { background: #087f5b; border-color: #087f5b; }
  .btn-danger { background: #b42318; border-color: #b42318; }
  .btn-blue { background: #175cd3; border-color: #175cd3; }
  
  /* Screens */
  .screen { display: none; height: 100%; overflow-y: auto; padding: 15px; }
  .screen.active { display: block; }
  
  /* Grid Layouts */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  
  .card { background: #151d26; border: 1px solid #26303a; padding: 15px; border-radius: 8px; margin-bottom: 12px; }
  .card-title { font-size: 12px; color: #9aa7b4; text-transform: uppercase; font-weight: bold; margin-bottom: 10px; }
  
  /* Match List */
  .match-item { display: flex; justify-content: space-between; background: #1e293b; padding: 10px; border-radius: 6px; margin-bottom: 8px; align-items: center; }
  
  /* HUD */
  .hud { display: flex; justify-content: space-between; background: #087f5b; padding: 15px; border-radius: 8px; margin-bottom: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
  .hud-score { font-size: 32px; font-weight: 900; }
  
  /* Scoring Buttons */
  .score-pad button { height: 50px; font-size: 20px; font-weight: 900; background: #1e293b; }
  .score-pad button[data-run="4"] { background: #175cd3; }
  .score-pad button[data-run="6"] { background: #087f5b; }
  .extra-pad button { height: 45px; background: #78350f; }
  .wicket-pad button { height: 45px; background: #b42318; }
  
  /* Modals */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 100; }
  .modal-overlay.active { display: flex; }
  .modal { background: #151d26; padding: 20px; border-radius: 10px; width: 90%; max-width: 400px; border: 1px solid #303944; }
  
  /* Timeline */
  .timeline { max-height: 150px; overflow-y: auto; background: #0b0f14; padding: 10px; border-radius: 6px; }
  .timeline-item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #1e293b; font-size: 12px; }
  .timeline-item button { padding: 4px 8px; font-size: 10px; background: #475569; }
</style>
</head>
<body>

<!-- ================= 1. START / LOAD SCREEN ================= -->
<div id="screen-home" class="screen active">
  <h2 style="color: #087f5b;">M.B. LIVE STUDIO</h2>
  
  <div class="card">
    <div class="card-title">Load Saved Match</div>
    <div id="savedMatchesList"></div>
  </div>

  <div class="card">
    <div class="card-title">Create New Match</div>
    <div class="grid-2">
      <input type="text" id="tA_name" placeholder="Team A Name" value="IND">
      <input type="text" id="tB_name" placeholder="Team B Name" value="AUS">
      
      <div><label style="font-size:10px; color:#9aa7b4;">Total Squad Size</label><input type="number" id="squadSize" value="11" min="2"></div>
      <div><label style="font-size:10px; color:#9aa7b4;">Max Overs</label><input type="number" id="maxOvers" value="20" min="1"></div>
      
      <select id="tossWinner"><option value="A">Team A Won Toss</option><option value="B">Team B Won Toss</option></select>
      <select id="tossDecision"><option value="BAT">Elected to BAT</option><option value="BOWL">Elected to BOWL</option></select>
    </div>
    <button class="btn-primary" style="width:100%; margin-top:10px;" onclick="createNewMatch()">CREATE MATCH</button>
  </div>
</div>

<!-- ================= 2. LIVE CONTROLLER SCREEN ================= -->
<div id="screen-live" class="screen">
  
  <div class="hud">
    <div>
      <div id="hudTeam" style="font-size:14px; font-weight:bold; color:#cbd5e1;">TEAM</div>
      <div class="hud-score"><span id="hudRuns">0</span>/<span id="hudWickets">0</span></div>
      <div style="font-size:12px; font-weight:bold;">Overs: <span id="hudOvers">0.0</span></div>
    </div>
    <div style="text-align: right;">
      <button class="btn-danger" style="padding:5px 10px; font-size:10px;" onclick="exitToHome()">EXIT TO MENU</button>
      <div style="margin-top:10px; font-size:12px;">CRR: <span id="hudCrr">0.00</span></div>
      <div style="font-size:12px; margin-top:5px; color:#facc15;">Target: <span id="hudTarget">—</span></div>
    </div>
  </div>

  <!-- Players On Crease -->
  <div class="card">
    <div class="card-title" style="display:flex; justify-content:space-between;">
      <span>ON CREASE</span>
      <button class="btn-blue" style="padding:4px 10px; font-size:10px;" onclick="swapStrike()"><i class="fas fa-exchange-alt"></i> SWAP STRIKE</button>
    </div>
    <div class="grid-2" style="margin-bottom:10px;">
      <div><label style="font-size:10px; color:#9aa7b4;">Striker *</label><select id="strikerSelect" onchange="manualPlayerChange()"></select></div>
      <div><label style="font-size:10px; color:#9aa7b4;">Non-Striker</label><select id="nonStrikerSelect" onchange="manualPlayerChange()"></select></div>
    </div>
    <div><label style="font-size:10px; color:#9aa7b4;">Bowler</label><select id="bowlerSelect" onchange="manualPlayerChange()"></select></div>
  </div>

  <!-- Keypad -->
  <div class="card score-pad">
    <div class="card-title">SCORE RUNS</div>
    <div class="grid-4">
      <button onclick="processBall(0)">0</button>
      <button onclick="processBall(1)">1</button>
      <button onclick="processBall(2)">2</button>
      <button onclick="processBall(3)">3</button>
      <button onclick="processBall(4)" style="grid-column: span 2;" data-run="4">4</button>
      <button onclick="processBall(6)" style="grid-column: span 2;" data-run="6">6</button>
    </div>
  </div>

  <!-- Extras & Wickets -->
  <div class="card">
    <div class="grid-2">
      <div class="extra-pad grid-2">
        <button onclick="openExtraModal('WD')">WD</button>
        <button onclick="openExtraModal('NB')">NB</button>
        <button onclick="openExtraModal('B')">BYE</button>
        <button onclick="openExtraModal('LB')">LB</button>
      </div>
      <div class="wicket-pad grid-2">
        <button onclick="openWicketModal('CAUGHT')">CAUGHT</button>
        <button onclick="processWicket('BOWLED')">BOWLED</button>
        <button onclick="openWicketModal('RUN_OUT')">RUN OUT</button>
        <button onclick="openWicketModal('STUMPED')">STUMPED</button>
      </div>
    </div>
  </div>

  <!-- Graphics & Timeline -->
  <div class="card">
    <div class="card-title">BROADCAST GRAPHICS</div>
    <div class="grid-4" style="margin-bottom: 10px;">
      <button class="btn-blue" style="font-size:10px;" onclick="toggleGraphic('scorebug')">SCOREBUG</button>
      <button class="btn-blue" style="font-size:10px;" onclick="toggleGraphic('partnership')">PARTNER</button>
      <button class="btn-blue" style="font-size:10px;" onclick="toggleGraphic('target')">TARGET</button>
      <button class="btn-blue" style="font-size:10px;" onclick="toggleGraphic('bottomStrip')">INFO STRIP</button>
    </div>
    <div class="card-title">TIMELINE & DEEP UNDO</div>
    <div class="timeline" id="timelineList"></div>
  </div>
</div>

<!-- ================= MODALS ================= -->
<!-- Extra Runs Modal -->
<div class="modal-overlay" id="extraModal">
  <div class="modal">
    <h3 id="extraTitle">Extra Ball</h3>
    <p style="font-size:12px; color:#9aa7b4;">How many runs were run by batsmen on this extra?</p>
    <input type="number" id="extraRunsInput" value="0" min="0" style="width:100%; font-size:20px; text-align:center;">
    <div class="grid-2" style="margin-top:15px;">
      <button class="btn-primary" onclick="submitExtra()">SUBMIT</button>
      <button class="btn-danger" onclick="closeModal('extraModal')">CANCEL</button>
    </div>
  </div>
</div>

<!-- Wicket Modal (Fielder) -->
<div class="modal-overlay" id="wicketModal">
  <div class="modal">
    <h3 id="wicketTitle">Wicket</h3>
    <div style="margin-bottom:10px;">
      <label style="font-size:12px; color:#9aa7b4;">Who got Out?</label>
      <select id="outBatterSelect"><option value="STRIKER">Striker</option><option value="NON_STRIKER">Non-Striker</option></select>
    </div>
    <div style="margin-bottom:10px;">
      <label style="font-size:12px; color:#9aa7b4;">Select Fielder/Keeper</label>
      <select id="fielderSelect"></select>
    </div>
    <div class="grid-2" style="margin-top:15px;">
      <button class="btn-primary" onclick="submitWicket()">OUT</button>
      <button class="btn-danger" onclick="closeModal('wicketModal')">CANCEL</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCgAURksaOv2NtQ9LeVHVoLj4RFtDs7PVY",
  authDomain: "mb-live-score.firebaseapp.com",
  databaseURL: "https://mb-live-score-default-rtdb.firebaseio.com",
  projectId: "mb-live-score"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const liveRef = ref(db, "current_match");

// GLOBAL MATCH STATE
window.state = null;
window.timelineHistory = [];
window.tempExtraType = "";
window.tempWicketType = "";

// Initialize App
function initApp() {
  renderSavedMatches();
}

// ================= MATCH MANAGEMENT =================
window.createNewMatch = function() {
  const tA = document.getElementById('tA_name').value;
  const tB = document.getElementById('tB_name').value;
  const squadSize = parseInt(document.getElementById('squadSize').value);
  const maxOvers = parseInt(document.getElementById('maxOvers').value);
  const tossW = document.getElementById('tossWinner').value;
  const tossD = document.getElementById('tossDecision').value;
  
  let batTeam = (tossW === "A" && tossD === "BAT") || (tossW === "B" && tossD === "BOWL") ? "A" : "B";
  let bowlTeam = batTeam === "A" ? "B" : "A";

  // Generate generic squads based on size
  let rosterA = Array.from({length: squadSize}, (_, i) => ({ id: `A${i+1}`, name: `${tA} Player ${i+1}`, isOut: false }));
  let rosterB = Array.from({length: squadSize}, (_, i) => ({ id: `B${i+1}`, name: `${tB} Player ${i+1}`, isOut: false }));

  state = {
    id: "MB_" + Date.now(),
    title: `${tA} vs ${tB}`,
    meta: { tA, tB, squadSize, maxOvers, batTeam, bowlTeam },
    squads: { A: rosterA, B: rosterB },
    innings: 1,
    score: 0, wickets: 0, legalBalls: 0, overBalls: [], 
    target: null,
    striker: rosterA[0].id, nonStriker: rosterA[1].id, bowler: rosterB[0].id, lastBowler: null,
    graphics: { scorebug: true, partnership: false, target: false, bottomStrip: true, dynamicText: "M.B. LIVE STUDIO" }
  };
  if(batTeam === "B"){ state.striker = rosterB[0].id; state.nonStriker = rosterB[1].id; state.bowler = rosterA[0].id; }

  timelineHistory = [];
  saveMatchLocal();
  startLiveController();
};

window.renderSavedMatches = function() {
  const list = document.getElementById('savedMatchesList');
  const matches = JSON.parse(localStorage.getItem('mb_saved_matches') || '[]');
  if(matches.length === 0) { list.innerHTML = "<div style='font-size:12px; color:#9aa7b4;'>No saved matches.</div>"; return; }
  
  list.innerHTML = matches.map(m => `
    <div class="match-item">
      <div><b>${m.title}</b> <div style="font-size:10px; color:#9aa7b4;">${m.meta.squadSize} Players | Ov: ${Math.floor(m.legalBalls/6)}.${m.legalBalls%6}</div></div>
      <div style="display:flex; gap:5px;">
        <button class="btn-primary" style="font-size:10px; padding:5px;" onclick="loadMatch('${m.id}')">LOAD</button>
        <button class="btn-danger" style="font-size:10px; padding:5px;" onclick="deleteMatch('${m.id}')"><i class="fas fa-trash"></i></button>
      </div>
    </div>
  `).join('');
};

window.loadMatch = function(id) {
  const matches = JSON.parse(localStorage.getItem('mb_saved_matches') || '[]');
  const m = matches.find(x => x.id === id);
  if(m) { 
    state = m; 
    timelineHistory = JSON.parse(localStorage.getItem(`mb_timeline_${id}`) || '[]');
    startLiveController(); 
  }
};

window.deleteMatch = function(id) {
  let matches = JSON.parse(localStorage.getItem('mb_saved_matches') || '[]');
  matches = matches.filter(x => x.id !== id);
  localStorage.setItem('mb_saved_matches', JSON.stringify(matches));
  localStorage.removeItem(`mb_timeline_${id}`);
  renderSavedMatches();
};

window.saveMatchLocal = function() {
  if(!state) return;
  let matches = JSON.parse(localStorage.getItem('mb_saved_matches') || '[]');
  const idx = matches.findIndex(x => x.id === state.id);
  if(idx > -1) matches[idx] = state; else matches.unshift(state);
  localStorage.setItem('mb_saved_matches', JSON.stringify(matches));
  localStorage.setItem(`mb_timeline_${state.id}`, JSON.stringify(timelineHistory));
  set(liveRef, state); // Sync to Broadcast overlay
};

window.exitToHome = function() {
  document.getElementById('screen-live').classList.remove('active');
  document.getElementById('screen-home').classList.add('active');
  set(liveRef, null); // Clear overlay
  renderSavedMatches();
};

function startLiveController() {
  document.getElementById('screen-home').classList.remove('active');
  document.getElementById('screen-live').classList.add('active');
  updateUI();
}

// ================= SCORING LOGIC & DEEP UNDO =================
function pushSnapshot(desc) {
  timelineHistory.unshift({ id: Date.now(), desc: desc, snapshot: JSON.stringify(state) });
  if(timelineHistory.length > 50) timelineHistory.pop();
}

window.undoToSnapshot = function(id) {
  const idx = timelineHistory.findIndex(x => x.id === id);
  if(idx > -1) {
    state = JSON.parse(timelineHistory[idx].snapshot);
    timelineHistory.splice(0, idx + 1);
    saveMatchLocal();
    updateUI();
  }
};

window.processBall = function(runs) {
  if(checkAllOut()) return;
  pushSnapshot(`Score ${runs} runs`);
  
  state.score += runs;
  state.legalBalls += 1;
  state.overBalls.push(runs);
  
  if(runs % 2 !== 0) swapStrikeInternal();
  checkOver();
  triggerAutoGraphic(runs === 4 ? "FOUR" : (runs === 6 ? "SIX" : null));
  finalizeAction();
};

// ================= EXTRAS =================
window.openExtraModal = function(type) {
  tempExtraType = type;
  document.getElementById('extraTitle').innerText = type === "WD" ? "Wide Ball" : type === "NB" ? "No Ball" : type === "B" ? "Byes" : "Leg Byes";
  document.getElementById('extraRunsInput').value = 0;
  document.getElementById('extraModal').classList.add('active');
};

window.submitExtra = function() {
  const extraRuns = parseInt(document.getElementById('extraRunsInput').value) || 0;
  closeModal('extraModal');
  if(checkAllOut()) return;
  
  pushSnapshot(`Extra: ${tempExtraType} + ${extraRuns} runs`);
  
  let isLegal = (tempExtraType === 'B' || tempExtraType === 'LB');
  let penalty = (tempExtraType === 'WD' || tempExtraType === 'NB') ? 1 : 0;
  let totalRuns = extraRuns + penalty;
  
  state.score += totalRuns;
  state.overBalls.push(`${tempExtraType}${extraRuns>0 ? '+'+extraRuns : ''}`);
  
  if(isLegal) state.legalBalls += 1;
  if(extraRuns % 2 !== 0) swapStrikeInternal();
  if(isLegal) checkOver();
  
  finalizeAction();
};

// ================= WICKETS & FIELDER SELECT =================
window.openWicketModal = function(type) {
  tempWicketType = type;
  document.getElementById('wicketTitle').innerText = type.replace('_', ' ');
  
  const fieldTeam = state.meta.bowlTeam;
  const select = document.getElementById('fielderSelect');
  select.innerHTML = '<option value="">-- Select Fielder --</option>';
  state.squads[fieldTeam].forEach(p => {
    select.innerHTML += `<option value="${p.id}">${p.name}</option>`;
  });
  
  document.getElementById('wicketModal').classList.add('active');
};

window.submitWicket = function() {
  const who = document.getElementById('outBatterSelect').value;
  const fielder = document.getElementById('fielderSelect').value;
  if(!fielder) { alert("Please select a fielder/keeper."); return; }
  closeModal('wicketModal');
  processWicket(tempWicketType, who, fielder);
};

window.processWicket = function(type, who = "STRIKER", fielderId = null) {
  if(checkAllOut()) return;
  pushSnapshot(`WICKET: ${type.replace('_',' ')}`);
  
  state.wickets += 1;
  state.legalBalls += 1;
  state.overBalls.push('W');
  
  const batTeam = state.meta.batTeam;
  const outId = who === "STRIKER" ? state.striker : state.nonStriker;
  
  // Mark player as Out (Removes from Dropdown)
  const pIdx = state.squads[batTeam].findIndex(p => p.id === outId);
  if(pIdx > -1) state.squads[batTeam][pIdx].isOut = true;
  
  // Auto-assign next available batter
  const nextBatter = state.squads[batTeam].find(p => !p.isOut && p.id !== state.striker && p.id !== state.nonStriker);
  
  if(who === "STRIKER" && nextBatter) state.striker = nextBatter.id;
  else if (nextBatter) state.nonStriker = nextBatter.id;
  
  checkOver();
  triggerAutoGraphic("WICKET");
  finalizeAction();
};

// ================= LOGIC UTILS =================
function checkAllOut() {
  if (state.wickets >= state.meta.squadSize - 1) {
    alert("Team is All Out!");
    return true;
  }
  return false;
}

function swapStrikeInternal() {
  const temp = state.striker; state.striker = state.nonStriker; state.nonStriker = temp;
}
window.swapStrike = function() { pushSnapshot("Swap Strike"); swapStrikeInternal(); finalizeAction(); };

function checkOver() {
  if(state.legalBalls % 6 === 0 && state.legalBalls > 0) {
    swapStrikeInternal();
    state.lastBowler = state.bowler; // Restrict from bowling next over
    
    // Auto-assign next bowler (different from last)
    const fieldTeam = state.meta.bowlTeam;
    const nextBowler = state.squads[fieldTeam].find(p => p.id !== state.lastBowler);
    if(nextBowler) state.bowler = nextBowler.id;
    
    state.overBalls = [];
    state.graphics.dynamicText = `END OF OVER ${state.legalBalls/6}`;
  }
}

window.closeModal = function(id) { document.getElementById(id).classList.remove('active'); };

// ================= GRAPHICS & UI =================
window.toggleGraphic = function(key) {
  state.graphics[key] = !state.graphics[key];
  saveMatchLocal();
};

function triggerAutoGraphic(type) {
  if(!type) return;
  state.graphics.activeEvent = type;
  setTimeout(() => { state.graphics.activeEvent = null; set(liveRef, state); }, 4000);
}

window.manualPlayerChange = function() {
  state.striker = document.getElementById('strikerSelect').value;
  state.nonStriker = document.getElementById('nonStrikerSelect').value;
  state.bowler = document.getElementById('bowlerSelect').value;
  saveMatchLocal();
};

function finalizeAction() {
  saveMatchLocal();
  updateUI();
}

function updateUI() {
  if(!state) return;
  const tBat = state.meta.batTeam; const tBowl = state.meta.bowlTeam;
  
  document.getElementById('hudTeam').innerText = state.meta[tBat === 'A' ? 'tA' : 'tB'];
  document.getElementById('hudRuns').innerText = state.score;
  document.getElementById('hudWickets').innerText = state.wickets;
  document.getElementById('hudOvers').innerText = `${Math.floor(state.legalBalls/6)}.${state.legalBalls%6}`;
  document.getElementById('hudCrr').innerText = state.legalBalls > 0 ? ((state.score / state.legalBalls) * 6).toFixed(2) : "0.00";
  
  // Populate Player Selects (Filter Out players)
  const batOptions = state.squads[tBat].filter(p => !p.isOut).map(p => `<option value="${p.id}" ${state.striker===p.id||state.nonStriker===p.id?'selected':''}>${p.name}</option>`).join('');
  
  // Striker / Non-Striker Setup
  const sSel = document.getElementById('strikerSelect'); const nsSel = document.getElementById('nonStrikerSelect');
  sSel.innerHTML = state.squads[tBat].filter(p => !p.isOut).map(p => `<option value="${p.id}" ${state.striker===p.id?'selected':''}>${p.name}</option>`).join('');
  nsSel.innerHTML = state.squads[tBat].filter(p => !p.isOut).map(p => `<option value="${p.id}" ${state.nonStriker===p.id?'selected':''}>${p.name}</option>`).join('');
  
  // Bowler Setup (Filter Last Bowler)
  const bSel = document.getElementById('bowlerSelect');
  bSel.innerHTML = state.squads[tBowl].filter(p => p.id !== state.lastBowler).map(p => `<option value="${p.id}" ${state.bowler===p.id?'selected':''}>${p.name}</option>`).join('');

  // Timeline render
  const tl = document.getElementById('timelineList');
  tl.innerHTML = timelineHistory.map(t => `
    <div class="timeline-item">
      <span>${t.desc}</span>
      <button onclick="undoToSnapshot(${t.id})">↶ UNDO</button>
    </div>
  `).join('');
}

// Start
initApp();
</script>
</body>
</html>
