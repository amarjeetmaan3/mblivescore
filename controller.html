<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MB Live Score — Controller</title>

<style>
/* =====================================================
   NEW PREMIUM MOBILE-APP DESIGN (CSS ONLY)
===================================================== */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; background: #0b0f14; color: #f8fafc;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 14px;
}
body { min-height: 100vh; overflow-y: auto; padding-bottom: 40px; }

/* Typography & General */
h1, h2, h3, p { margin: 0; }
.hidden { display: none !important; }

#app {
  width: 100%; max-width: 600px; /* Mobile App Width */
  margin: 0 auto; padding: 10px;
}

/* ================= TOP BAR ================= */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 15px; background: rgba(18, 24, 32, 0.85); backdrop-filter: blur(10px);
  border: 1px solid #26303a; border-radius: 10px; margin-bottom: 12px;
  position: sticky; top: 10px; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}
.title { font-size: 16px; font-weight: 900; color: #38bdf8; letter-spacing: 0.5px; }
.status { font-size: 11px; padding: 4px 8px; border-radius: 6px; font-weight: 800; background: #334155; color: #fff; text-transform: uppercase; }
.status.ok { background: #059669; box-shadow: 0 0 8px rgba(5, 150, 105, 0.4); }
.status.err { background: #dc2626; box-shadow: 0 0 8px rgba(220, 38, 38, 0.4); }

/* ================= SECTIONS & CARDS ================= */
.section {
  background: #111820; border: 1px solid #1e293b; border-radius: 12px;
  padding: 15px; margin-bottom: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.2);
}
.section-title {
  font-size: 12px; font-weight: 900; text-transform: uppercase; color: #94a3b8;
  margin-bottom: 12px; border-bottom: 1px solid #1e293b; padding-bottom: 6px;
  letter-spacing: 0.5px;
}

/* ================= INPUTS & FORMS ================= */
.field label { display: block; color: #64748b; font-size: 10px; font-weight: 800; margin-bottom: 4px; text-transform: uppercase; }
input, select {
  width: 100%; background: #070a0d; color: #fff; border: 1px solid #334155;
  border-radius: 8px; padding: 12px 10px; font-size: 14px; outline: none; transition: 0.2s;
}
input:focus, select:focus { border-color: #38bdf8; box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }

/* ================= BUTTONS ================= */
button {
  border: 0; border-radius: 8px; padding: 12px 10px; background: #1e293b; color: #fff;
  font-size: 13px; font-weight: 800; cursor: pointer; transition: 0.15s ease;
  display: flex; align-items: center; justify-content: center;
}
button:active { transform: scale(0.95); }
button.primary { background: #0284c7; color: #fff; }
button.danger { background: #dc2626; color: #fff; }
button.warn { background: #d97706; color: #fff; }
button.blue { background: #2563eb; color: #fff; }
button.small { padding: 6px 12px; font-size: 11px; }
button.active { outline: 2px solid #38bdf8; background: #0284c7; }

/* ================= GRIDS ================= */
.grid { display: grid; gap: 8px; }
.g2 { grid-template-columns: repeat(2, 1fr); }
.g3 { grid-template-columns: repeat(3, 1fr); }
.g4 { grid-template-columns: repeat(4, 1fr); }
.g5 { grid-template-columns: repeat(5, 1fr); }
.g6 { grid-template-columns: repeat(6, 1fr); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: space-between; }

/* ================= SCORE HUD ================= */
.score { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 5px; }
.teambox {
  background: linear-gradient(135deg, #1e3a8a, #0ea5e9); border: 1px solid #3b82f6;
  border-radius: 10px; padding: 15px; position: relative; overflow: hidden;
}
.teambox:nth-child(2) { background: #1e293b; border-color: #334155; }
.teamname { font-size: 12px; font-weight: 900; color: #e0f2fe; text-transform: uppercase; }
.teambox:nth-child(2) .teamname { color: #94a3b8; }
.bigscore { font-size: 34px; font-weight: 900; margin: 4px 0; color: #facc15; font-family: 'Arial Black', sans-serif; letter-spacing: -1px; }
.teambox:nth-child(2) .bigscore { color: #fff; }
.mini { color: #bae6fd; font-size: 11px; font-weight: 600; }
.teambox:nth-child(2) .mini { color: #94a3b8; }

/* ================= LIVE CONTROLS (MOBILE OPTIMIZED) ================= */
.score-buttons button { height: 55px; font-size: 20px; font-weight: 900; border: 1px solid #334155; }
.score-buttons button[data-run="4"] { background: #2563eb; border-color: #1d4ed8; color: #fff; }
.score-buttons button[data-run="6"] { background: #059669; border-color: #047857; color: #fff; }

.extra-buttons button { height: 45px; background: #78350f; border: 1px solid #92400e; font-size: 13px; }
.wicket-buttons button { height: 40px; background: #b91c1c; border: 1px solid #991b1b; font-size: 11px; }
.control-buttons button { height: 45px; font-size: 12px; }

/* Graphics Buttons */
.graphic-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.graphic-btn { font-size: 10px; padding: 12px 6px; background: #0f172a; border: 1px solid #1e293b; color: #94a3b8; }
.graphic-btn.active { background: #0284c7; color: #fff; border-color: #0369a1; outline: none; }

/* Player Setup Grid */
.players { display: grid; grid-template-columns: 1fr; gap: 8px; }
.player-row { display: grid; grid-template-columns: 1fr 70px; gap: 8px; }

/* Event Log */
.event-list { display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto; background: #070a0d; padding: 10px; border-radius: 8px; border: 1px solid #1e293b; }
.event { padding: 8px; border-radius: 6px; background: #1e293b; font-size: 12px; border-left: 3px solid #38bdf8; }
.event b { color: #facc15; font-size: 11px; margin-right: 5px; }

/* Toast & Modal */
.toast {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
  background: #facc15; color: #000; border: 1px solid #ca8a04;
  padding: 10px 20px; border-radius: 20px; z-index: 9999;
  font-size: 13px; font-weight: 900; display: none; text-transform: uppercase; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 9998; padding: 15px; backdrop-filter: blur(4px); }
.modal-box { width: 100%; max-width: 400px; background: #111820; border: 1px solid #334155; border-radius: 12px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
.modal-title { font-weight: 900; font-size: 16px; margin-bottom: 12px; color: #38bdf8; }

/* Adjustments for very small screens */
@media(max-width: 400px){
  .graphic-grid { grid-template-columns: repeat(2, 1fr); }
  .wicket-buttons { grid-template-columns: repeat(2, 1fr); }
  .score-buttons button { height: 45px; font-size: 16px; }
}
</style>
</head>

function buildPlayerInputs(){

  const a=$("teamAPlayers");

  a.innerHTML="";

  for(let i=1;i<=11;i++){

    a.innerHTML+=`

function readPlayers(prefix){

  const arr=[];

  for(let i=1;i<=11;i++){

    const name=$(prefix+"Player"+i).value.trim();
    const number=$(prefix+"Num"+i).value.trim();

    arr.push({
      id:prefix+i,
      name:name || `${prefix==="a"?"A":"B"} Player ${i}`,
      number:number || ""
    });
  }

  return arr;
}

function buildState(){

  const teamA=makeTeam(
    $("teamAName").value.trim(),
    $("teamAShort").value.trim(),
    $("teamALogo").value.trim(),
    readPlayers("a")
  );

  const teamB=makeTeam(
    $("teamBName").value.trim(),
    $("teamBShort").value.trim(),
    $("teamBLogo").value.trim(),
    readPlayers("b")
  );

  const maxOvers=safeNumber($("maxOvers").value) || 20;

  const toss=$("toss").value;

  let batting="A";

  if(toss==="B_BAT") batting="B";

  if(toss==="A_BAT") batting="A";

  const bowling=batting==="A"?"B":"A";

  const innings=createInnings(1,batting,bowling);

  innings.striker=teamA.players[0]?.id;
  innings.nonStriker=teamA.players[1]?.id;

  if(batting==="B"){

    innings.striker=teamB.players[0]?.id;
    innings.nonStriker=teamB.players[1]?.id;

  }

  innings.bowler=batting==="A"
    ? teamB.players[0]?.id
    : teamA.players[0]?.id;


  const s={

    version:1,

    id:$("matchId").value.trim() || "MB-"+Date.now(),

    meta:{
      tournament:$("tournament").value.trim(),
      matchId:$("matchId").value.trim(),
      matchNumber:$("matchNo").value.trim(),
      date:$("matchDate").value || today(),
      venue:$("venue").value.trim(),
      format:$("format").value,
      maxOvers,
      inningsPerSide:safeNumber($("inningsPerSide").value) || 1
    },

    teams:{
      A:teamA,
      B:teamB
    },

    toss,

    innings:[innings],

    currentInnings:0,

    result:{
      status:"",
      winner:"",
      text:""
    },

    graphics:defaultGraphics(),

    events:[],

    updatedAt:Date.now()

  };

  return s;

}


/* =========================================================
   FIREBASE SAVE
========================================================= */

async function saveState(showToast=true){

  if(!state || !db) return;

  state.updatedAt=Date.now();

  try{

    if(!matchRef){

      matchRef=ref(db,"current_match");

    }

    await set(matchRef,state);

    if(showToast) toast("Saved");

    $("connectionStatus").textContent="Saved";
    $("connectionStatus").className="status ok";

  }catch(error){

    console.error(error);

    $("connectionStatus").textContent="Save Error";
    $("connectionStatus").className="status err";

    toast("Save failed");

  }

}


/* =========================================================
   CREATE MATCH
========================================================= */

$("createMatchBtn").onclick=async()=>{

  if(!db){

    alert("Firebase is not connected.");
    return;

  }

  state=buildState();

  undoStack=[];

  matchRef=ref(db,"current_match");

  await saveState(false);

  showControl();

  toast("Match created");

};


/* =========================================================
   LOAD SAVED
========================================================= */

$("loadMatchBtn").onclick=async()=>{

  if(!db){

    alert("Firebase is not connected.");
    return;

  }

  try{

    const snap=await get(ref(db,"current_match"));

    if(!snap.exists()){

      alert("No saved match found.");
      return;

    }

    state=snap.val();

    normalizeState();

    matchRef=ref(db,"current_match");

    showControl();

    toast("Match loaded");

  }catch(error){

    console.error(error);
    alert("Unable to load match.\n\n"+error.message);

  }

};


/* =========================================================
   NORMALIZE
========================================================= */

function normalizeState(){

  if(!state) return;

  state.graphics={
    ...defaultGraphics(),
    ...(state.graphics||{})
  };

  state.events=state.events||[];

  state.innings=state.innings||[];

  state.innings.forEach(i=>{

    i.extras=i.extras||{
      wides:0,
      noBalls:0,
      byes:0,
      legByes:0,
      penalty:0
    };

    i.battingStats=i.battingStats||{};
    i.bowlingStats=i.bowlingStats||{};
    i.fallOfWickets=i.fallOfWickets||[];
    i.partnerships=i.partnerships||[];
    i.ballHistory=i.ballHistory||[];
    i.events=i.events||[];

    i.currentPartnership=i.currentPartnership||{
      runs:0,
      balls:0,
      wickets:0
    };

  });

}

/* =========================================================
   CURRENT INNINGS
========================================================= */

function innings(){

  if(!state || !state.innings.length) return null;

  return state.innings[state.currentInnings];

}


function currentBattingTeam(){

  const i=innings();

  return i ? state.teams[i.battingTeam] : null;

}


function currentBowlingTeam(){

  const i=innings();

  return i ? state.teams[i.bowlingTeam] : null;

}


function playerById(id){

  if(!state) return null;

  for(const key of ["A","B"]){

    const p=state.teams[key].players.find(x=>x.id===id);

    if(p) return p;

  }

  return null;

}


/* =========================================================
   PLAYER STATS
========================================================= */

function getBatStats(i,id){

  if(!i.battingStats[id]){

    i.battingStats[id]=emptyStats();

  }

  return i.battingStats[id];

}


function getBowlStats(i,id){

  if(!i.bowlingStats[id]){

    i.bowlingStats[id]=emptyBowling();

  }

  return i.bowlingStats[id];

}


/* =========================================================
   UNDO
========================================================= */

function pushUndo(){

  if(!state) return;

  undoStack.push(clone(state));

  if(undoStack.length>MAX_UNDO){

    undoStack.shift();

  }

}


$("undoBtn").onclick=async()=>{

  if(!undoStack.length){

    toast("Nothing to undo");
    return;

  }

  state=undoStack.pop();

  normalizeState();

  await saveState(false);

  render();

  toast("Undone");

};


/* =========================================================
   SCORE ENGINE
========================================================= */

function addBall({

  batRuns=0,
  extraType="",
  extraRuns=0,
  legal=true,
  wicketType="",
  commentary=""

}){

  const i=innings();

  if(!i) return;

  if(i.completed){

    toast("Innings completed");
    return;

  }

  pushUndo();

  const striker=i.striker;
  const nonStriker=i.nonStriker;
  const bowler=i.bowler;

  if(!striker){

    toast("Select striker");
    undoStack.pop();
    return;

  }

  if(!bowler){

    toast("Select bowler");
    undoStack.pop();
    return;

  }

  const bat=getBatStats(i,striker);
  const bowl=getBowlStats(i,bowler);

  const total=batRuns+extraRuns;

  /* TEAM RUNS */

  i.runs+=total;


  /* BATTER */

  bat.runs+=batRuns;

  if(legal){

    bat.balls+=1;

  }

  if(batRuns===0 && legal){

    bat.dots+=1;

  }

  if(batRuns===4){

    bat.fours+=1;

  }

  if(batRuns===6){

    bat.sixes+=1;

  }


  /* EXTRAS */

  if(extraType==="WD"){

    i.extras.wides+=extraRuns;

    bowl.wides+=extraRuns;

  }

  if(extraType==="NB"){

    i.extras.noBalls+=extraRuns;

    bowl.noBalls+=extraRuns;

  }

  if(extraType==="B"){

    i.extras.byes+=extraRuns;

  }

  if(extraType==="LB"){

    i.extras.legByes+=extraRuns;

  }


  /* BOWLER RUNS */

  bowl.runs+=batRuns;

  if(extraType==="WD" || extraType==="NB"){

    bowl.runs+=extraRuns;

  }


  /* LEGAL BALL */

  if(legal){

    i.legalBalls+=1;
    bowl.balls+=1;

  }


  /* WICKET */

  let wicket=null;

  if(wicketType){

    i.wickets+=1;

    bat.out=true;

    wicket={

      type:wicketType,

      batter:striker,

      bowler,

      time:Date.now()

    };

    if([
      "Bowled",
      "Caught",
      "LBW",
      "Stumped",
      "Hit Wicket",
      "C&B"
    ].includes(wicketType)){

      bowl.wickets+=1;

    }

    i.fallOfWickets.push({

      wicket:i.wickets,
      score:i.runs,
      overs:oversText(i.legalBalls),
      batter:striker,
      type:wicketType

    });

  }


  /* PARTNERSHIP */

  i.currentPartnership.runs+=total;

  if(legal){

    i.currentPartnership.balls+=1;

  }


  /* STRIKE */

  if(legal){

    if(total%2===1){

      [i.striker,i.nonStriker]=[
        i.nonStriker,
        i.striker
      ];

    }

  }


  /* BALL */

  const ball={

    over:Math.floor(i.legalBalls/6),

    ball:(i.legalBalls%6),

    striker,
    nonStriker,
    bowler,

    runsBat:batRuns,

    extras:{

      type:extraType || "",

      runs:extraRuns || 0

    },

    totalRuns:total,

    legal,

    wicket,

    commentary:

      commentary ||

      makeCommentary(
        batRuns,
        extraType,
        extraRuns,
        wicketType
      ),

    timestamp:Date.now()

  };

  i.ballHistory.push(ball);

  i.events.unshift({

    text:ball.commentary,

    time:Date.now()

  });

  state.events.unshift({

    type:wicketType
      ? "WICKET"
      : batRuns===4
      ? "FOUR"
      : batRuns===6
      ? "SIX"
      : "BALL",

    text:ball.commentary,

    time:Date.now()

  });


  /* FREE HIT */

  if(i.freeHit && legal){

    i.freeHit=false;

  }


  /* AUTO MILESTONE */

  if(
    bat.runs>0 &&
    (
      bat.runs===50 ||
      bat.runs===100 ||
      bat.runs===150
    )
  ){

    triggerGraphic(
      "milestone",
      `${playerById(striker)?.name || ""} ${bat.runs}`
    );

  }


  /* AUTO BOUNDARY */

  if(batRuns===4 || batRuns===6){

    triggerGraphic(
      "boundary",
      batRuns===4 ? "FOUR" : "SIX"
    );

  }


  /* AUTO WICKET */

  if(wicketType){

    triggerGraphic(
      "wicket",
      "WICKET"
    );

  }


  /* TARGET */

  if(i.target!==null && i.runs>=i.target){

    i.completed=true;

    state.result.status="completed";

    state.result.winner=i.battingTeam;

    state.result.text=
      `${state.teams[i.battingTeam].name} won`;

    triggerGraphic("result",state.result.text);

  }


  /* OVERS */

  if(
    state.meta.inningsPerSide===1 &&
    i.legalBalls >= state.meta.maxOvers*6
  ){

    i.completed=true;

    triggerGraphic(
      "inningsBreak",
      "INNINGS BREAK"
    );

  }


  saveState(false);

  render();

}


function makeCommentary(
  batRuns,
  extraType,
  extraRuns,
  wicketType
){

  if(wicketType){

    return `WICKET — ${wicketType}`;

  }

  if(extraType==="WD"){

    return `Wide ${extraRuns}`;

  }

  if(extraType==="NB"){

    return `No ball ${extraRuns}`;

  }

  if(extraType==="B"){

    return `Bye ${extraRuns}`;

  }

  if(extraType==="LB"){

    return `Leg bye ${extraRuns}`;

  }

  if(batRuns===6) return "SIX";

  if(batRuns===4) return "FOUR";

  return `${batRuns} run${batRuns===1?"":"s"}`;

}

/* =========================================================
   OVERS TEXT
========================================================= */

function oversText(balls){

  const over=Math.floor(balls/6);

  const ball=balls%6;

  return `${over}.${ball}`;

}


/* =========================================================
   RRR
========================================================= */

function calculateRRR(i){

  if(
    !i ||
    i.target===null
  ) return null;

  const remaining=i.target-i.runs;

  const totalBalls=
    state.meta.maxOvers*6;

  const left=
    totalBalls-i.legalBalls;

  if(left<=0) return remaining>0 ? Infinity : 0;

  return remaining/(left/6);

}


/* =========================================================
   SELECT PLAYERS
========================================================= */

function fillPlayerSelect(select,players,selected){

  select.innerHTML="";

  players.forEach(p=>{

    const o=document.createElement("option");

    o.value=p.id;

    o.textContent=p.name;

    if(p.id===selected){

      o.selected=true;

    }

    select.appendChild(o);

  });

}

/* =========================================================
   NEW BATTER
========================================================= */

$("newBatterBtn").onclick=()=>{

  const i=innings();

  if(!i) return;

  const team=state.teams[i.battingTeam];

  const used=[
    ...Object.keys(i.battingStats),
    i.striker,
    i.nonStriker
  ];

  const available=team.players.filter(
    p=>!used.includes(p.id)
  );

  if(!available.length){

    toast("No batter available");
    return;

  }

  pushUndo();

  i.striker=available[0].id;

  saveState(false);

  render();

};

    return;

/* =========================================================
   SECOND INNINGS
========================================================= */

$("newInningsBtn").onclick=()=>{

  if(!state) return;

  if(state.innings.length>=2){

    toast("Second innings already exists");
    return;

  }

  const first=innings();

  if(!first) return;

  pushUndo();

  first.completed=true;

  const batting=first.bowlingTeam;
  const bowling=first.battingTeam;

  const second=createInnings(
    2,
    batting,
    bowling
  );

  second.target=first.runs+1;

  const batTeam=state.teams[batting];
  const bowlTeam=state.teams[bowling];

  second.striker=batTeam.players[0]?.id;
  second.nonStriker=batTeam.players[1]?.id;
  second.bowler=bowlTeam.players[0]?.id;

  state.innings.push(second);

  state.currentInnings=1;

  triggerGraphic(
    "inningsBreak",
    "2ND INNINGS"
  );

  saveState(false);

  render();

  toast("Second innings started");

};

  if(!state) return;

  state.graphics.activeScene=scene;
  state.graphics.activeEvent=scene;
  state.graphics.eventText=text || "";
  state.graphics.eventTime=Date.now();

}

    btn.classList.toggle(

  };

});

/* =========================================================
   RESET MATCH
========================================================= */

$("resetMatchBtn").onclick=()=>{

  if(!state) return;

  const ok=confirm(
    "Reset current match completely?"
  );

  if(!ok) return;

  pushUndo();

  const old=state;

  const first=old.innings?.[0];

  const batting=first?.battingTeam || "A";
  const bowling=first?.bowlingTeam || "B";

  const i=createInnings(
    1,
    batting,
    bowling
  );

  const batTeam=old.teams[batting];
  const bowlTeam=old.teams[bowling];

  i.striker=batTeam.players[0]?.id;
  i.nonStriker=batTeam.players[1]?.id;
  i.bowler=bowlTeam.players[0]?.id;

  state.innings=[i];
  state.currentInnings=0;

  state.result={
    status:"",
    winner:"",
    text:""
  };

  state.events=[];

  state.graphics.activeScene="";
  state.graphics.activeEvent="";
  state.graphics.eventText="";

  saveState(false);

  render();

  toast("Match reset");

};

  $("inningsPerSide").value="1";

  $("toss").value="";

};


$("demoBtn").onclick=()=>{

  $("tournament").value="Demo Cricket League";
  $("matchId").value="DEMO-001";
  $("matchNo").value="1";
  $("matchDate").value=today();
  $("venue").value="Demo Stadium";
  $("maxOvers").value="20";
  $("format").value="T20";

  $("teamAName").value="TEAM A";
  $("teamAShort").value="TMA";

  $("teamBName").value="TEAM B";
  $("teamBShort").value="TMB";

  for(let i=1;i<=11;i++){

    $(`aPlayer${i}`).value=`A Player ${i}`;
    $(`bPlayer${i}`).value=`B Player ${i}`;

  }

  toast("Demo data filled");

};


/* =========================================================
   RENDER
========================================================= */

function render(){

  if(!state) return;

  normalizeState();

  const i=innings();

  if(!i) return;

  const batTeam=currentBattingTeam();

  $("matchTitle").textContent=
    state.meta.tournament ||
    "MB Live Score";

  $("matchInfo").textContent=
    `${state.meta.matchNumber ? "Match "+state.meta.matchNumber+" · " : ""}`+
    `${state.meta.venue || ""} · `+
    `${state.meta.format || ""} · `+
    `${state.meta.maxOvers} overs`;

  $("battingTeamName").textContent=
    batTeam?.name || "Batting";

  $("runs").textContent=i.runs;

  $("wickets").textContent=i.wickets;

  $("overs").textContent=
    oversText(i.legalBalls);

  $("target").textContent=
    i.target===null
      ? "—"
      : i.target;

  if(i.target!==null){

    const required=
      Math.max(0,i.target-i.runs);

    $("requiredRuns").textContent=
      required;

    const rrr=calculateRRR(i);

    $("rrr").textContent=
      Number.isFinite(rrr)
        ? rrr.toFixed(2)
        : "—";

    $("ballsRemaining").textContent=
      Math.max(
        0,
        state.meta.maxOvers*6-i.legalBalls
      );

  }else{

    $("requiredRuns").textContent="—";
    $("rrr").textContent="—";
    $("ballsRemaining").textContent="—";

  }


  /* PLAYER SELECTS */

  fillPlayerSelect(
    $("strikerSelect"),
    batTeam.players,
    i.striker
  );

  fillPlayerSelect(
    $("nonStrikerSelect"),
    batTeam.players,
    i.nonStriker
  );

  const bowlTeam=currentBowlingTeam();

  fillPlayerSelect(
    $("bowlerSelect"),
    bowlTeam.players,
    i.bowler
  );


  /* GRAPHIC BUTTON STATES */

  document.querySelectorAll(
    "[data-graphic]"
  ).forEach(btn=>{

    const key=btn.dataset.graphic;

    btn.classList.toggle(
      "active",
      !!state.graphics[key]
    );

  });


  /* EVENTS */

  const list=$("eventList");

  list.innerHTML="";

  const events=
    (i.events || []).slice(0,25);

  events.forEach(e=>{

    const div=document.createElement("div");

    div.className="event";

    const time=
      new Date(
        e.time || Date.now()
      ).toLocaleTimeString(
        [],
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      );

    div.innerHTML=
      `<b>${time}</b> — `+
      escapeHtml(e.text || "");

    list.appendChild(div);

  });

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value){

  return String(value)

    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   FIREBASE LIVE LISTENER
========================================================= */

if(db){

  matchRef=ref(db,"current_match");

  onValue(
    matchRef,
    snap=>{

      if(!snap.exists()){

        $("connectionStatus").textContent=
          "No Match";

        $("connectionStatus").className=
          "status";

        return;

      }

      const incoming=snap.val();

      /*
        Don't destroy local undo state when
        this controller itself saves.
      */

      if(
        !state ||
        incoming.updatedAt !== state.updatedAt
      ){

        state=incoming;

        normalizeState();

        if(
          $("controlPage").style.display!=="none"
        ){

          render();

        }

      }

      $("connectionStatus").textContent=
        "LIVE / SAVED";

      $("connectionStatus").className=
        "status ok";

    },

    error=>{

      console.error(error);

      $("connectionStatus").textContent=
        "Firebase Offline";

      $("connectionStatus").className=
        "status err";

    }

  );

}


/* =========================================================
   INITIAL DATE
========================================================= */

$("matchDate").value=today();


/* =========================================================
   AUTO LOAD SAVED MATCH ON OPEN
========================================================= */

(async function autoLoad(){

  if(!db) return;

  try{

    const snap=await get(
      ref(db,"current_match")
    );

    if(snap.exists()){

      state=snap.val();

      normalizeState();

      matchRef=ref(
        db,
        "current_match"
      );

      showControl();

      toast("Saved match restored");

    }

  }catch(error){

    console.warn(
      "Auto-load failed:",
      error
    );

  }

})();

</script>
