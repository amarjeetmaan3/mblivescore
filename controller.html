<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Broadcast Controller | Event Engine</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; font-size: 13px; }
  body { margin: 0; background: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  
  /* Core UI */
  .header { background: #020617; padding: 12px 20px; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; }
  .grid-panel { display: grid; grid-template-columns: 350px 1fr 300px; gap: 15px; padding: 15px; height: 100%; overflow: hidden; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 6px; display: flex; flex-direction: column; }
  .c-head { background: #0f172a; padding: 10px 15px; font-weight: 800; font-size: 11px; color: #94a3b8; text-transform: uppercase; border-bottom: 1px solid #334155; }
  .c-body { padding: 15px; overflow-y: auto; }
  
  /* Inputs & Buttons */
  button, input, select { outline: none; border: 1px solid #334155; background: #0f172a; color: #fff; padding: 8px 12px; border-radius: 4px; }
  button { font-weight: 800; cursor: pointer; transition: 0.1s; display: flex; align-items: center; justify-content: center; gap: 6px; }
  button:active { transform: scale(0.96); }
  
  .btn-run { background: #334155; height: 45px; font-size: 16px; font-family: 'Consolas', monospace; }
  .btn-run.b4 { background: #2563eb; border-color: #1d4ed8; }
  .btn-run.b6 { background: #059669; border-color: #047857; }
  .btn-extra { background: #78350f; height: 40px; }
  .btn-wkt { background: #dc2626; height: 40px; }
  .btn-sys { background: #0284c7; }
  
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

  /* Timeline */
  .tl-item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #334155; font-size: 12px; align-items: center; }
  .tl-item button { padding: 4px 8px; font-size: 10px; background: #475569; }
</style>
</head>
<body>

<div class="header">
  <h2 style="margin:0; color:#38bdf8; font-weight:900;">BROADCAST CONTROLLER <span style="font-size:12px; color:#64748b; font-weight:normal;">| EVENT ENGINE</span></h2>
  <div id="connStatus" style="color:#10b981; font-weight:bold; font-size:11px;">🟢 DB CONNECTED</div>
</div>

<div class="grid-panel">
  <!-- COL 1: Match State & Players -->
  <div class="card">
    <div class="c-head">MATCH STATE</div>
    <div class="c-body">
      <div style="background:#0284c7; padding:15px; border-radius:6px; margin-bottom:15px; box-shadow:0 4px 10px rgba(0,0,0,0.3);">
        <div id="hudTeam" style="font-size:12px; font-weight:800; color:#e0f2fe; text-transform:uppercase;">TEAM</div>
        <div style="font-size:36px; font-weight:900; line-height:1; margin:5px 0;" id="hudScore">0/0</div>
        <div style="display:flex; justify-content:space-between; font-size:12px; font-weight:bold;">
          <div>Overs: <span id="hudOvers">0.0</span></div>
          <div>CRR: <span id="hudCrr">0.00</span></div>
        </div>
        <div style="margin-top:8px; font-size:12px; color:#fde047; font-weight:bold; display:none;" id="hudTargetBox">
          TARGET: <span id="hudTarget">0</span> | RRR: <span id="hudRrr">0.00</span>
        </div>
      </div>

      <b style="color:#94a3b8; font-size:11px;">ACTIVE PLAYERS</b>
      <div class="grid-2" style="margin:8px 0;">
        <div><label style="font-size:10px; color:#38bdf8;">Striker *</label><select id="strikerSelect" onchange="manualChange()"></select></div>
        <div><label style="font-size:10px; color:#94a3b8;">Non-Striker</label><select id="nonStrikerSelect" onchange="manualChange()"></select></div>
      </div>
      <div><label style="font-size:10px; color:#c084fc;">Bowler</label><select id="bowlerSelect" onchange="manualChange()" style="width:100%;"></select></div>
      <button class="btn-sys" style="width:100%; margin-top:10px;" onclick="dispatch({type: 'SWAP_STRIKE'})">SWAP STRIKE</button>
    </div>
  </div>

  <!-- COL 2: Event Keypad -->
  <div class="card">
    <div class="c-head">EVENT DISPATCHER</div>
    <div class="c-body">
      <div class="grid-4" style="margin-bottom:10px;">
        <button class="btn-run" onclick="dispatch({type:'BALL', runs:0})">DOT</button>
        <button class="btn-run" onclick="dispatch({type:'BALL', runs:1})">1</button>
        <button class="btn-run" onclick="dispatch({type:'BALL', runs:2})">2</button>
        <button class="btn-run" onclick="dispatch({type:'BALL', runs:3})">3</button>
        <button class="btn-run b4" style="grid-column: span 2;" onclick="dispatch({type:'BALL', runs:4})">4</button>
        <button class="btn-run b6" style="grid-column: span 2;" onclick="dispatch({type:'BALL', runs:6})">6</button>
      </div>
      
      <div class="grid-4" style="margin-bottom:10px;">
        <button class="btn-extra" onclick="dispatchExtra('WD')">WD</button>
        <button class="btn-extra" onclick="dispatchExtra('NB')">NB</button>
        <button class="btn-extra" onclick="dispatchExtra('B')">BYE</button>
        <button class="btn-extra" onclick="dispatchExtra('LB')">LB</button>
      </div>

      <div class="grid-3" style="margin-bottom:15px;">
        <button class="btn-wkt" onclick="dispatchWicket('BOWLED')">BOWLED</button>
        <button class="btn-wkt" onclick="dispatchWicket('CAUGHT')">CAUGHT</button>
        <button class="btn-wkt" onclick="dispatchWicket('RUN_OUT')">RUN OUT</button>
      </div>

      <div class="grid-2">
        <button class="btn-sys" onclick="dispatch({type:'END_OVER'})">END OVER</button>
        <button class="btn-sys" style="background:#475569;" onclick="startSecondInnings()">2ND INNINGS</button>
      </div>
    </div>
  </div>

  <!-- COL 3: State Timeline -->
  <div class="card">
    <div class="c-head">DEEP UNDO TIMELINE</div>
    <div class="c-body" style="padding:0; overflow-y:auto;" id="timelineList"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

// Database Configuration (from previous context context)
const firebaseConfig = {
  apiKey: "AIzaSyCgAURksaOv2NtQ9LeVHVoLj4RFtDs7PVY",
  authDomain: "mb-live-score.firebaseapp.com",
  databaseURL: "https://mb-live-score-default-rtdb.firebaseio.com",
  projectId: "mb-live-score"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const matchRef = ref(db, "broadcast_state");

// Event Engine State
window.state = null;
window.timeline = [];

function initDummyMatch() {
  const genPlayers = (prefix) => Array.from({length: 11}, (_, i) => ({ id: `${prefix}${i+1}`, name: `${prefix} PLAYER ${i+1}`, runs: 0, balls: 0, fours: 0, sixes: 0, isOut: false, bRuns: 0, bBalls: 0, bWkts: 0, bMaidens: 0 }));
  
  state = {
    meta: { tA: "INDIA", tB: "AUSTRALIA", batTeam: "A", bowlTeam: "B", maxOvers: 20 },
    squads: { A: genPlayers("IND"), B: genPlayers("AUS") },
    innings: 1, score: 0, wickets: 0, legalBalls: 0, target: null, overLog: [],
    striker: "A1", nonStriker: "A2", bowler: "B1", lastBowler: null, graphics: { active: null }
  };
  saveState();
}

function saveState() {
  updateUI();
  set(matchRef, state);
  localStorage.setItem('bc_state', JSON.stringify(state));
}

function pushSnapshot(eventDesc) {
  timeline.unshift({ id: Date.now(), desc: eventDesc, snapshot: JSON.stringify(state) });
  if(timeline.length > 50) timeline.pop();
}

window.undoToEvent = function(id) {
  const idx = timeline.findIndex(t => t.id === id);
  if(idx > -1) { state = JSON.parse(timeline[idx].snapshot); timeline.splice(0, idx + 1); saveState(); }
};

// ================= MATCH ENGINE =================
window.dispatch = function(action) {
  pushSnapshot(`Action: ${action.type} ${action.runs !== undefined ? action.runs : ''}`);
  
  const tBat = state.meta.batTeam; const tBowl = state.meta.bowlTeam;
  const striker = state.squads[tBat].find(p => p.id === state.striker);
  const bowler = state.squads[tBowl].find(p => p.id === state.bowler);

  if (action.type === 'BALL') {
    state.score += action.runs;
    state.legalBalls += 1;
    state.overLog.push(action.runs);
    
    striker.runs += action.runs; striker.balls += 1;
    if(action.runs === 4) striker.fours++; if(action.runs === 6) striker.sixes++;
    bowler.bRuns += action.runs; bowler.bBalls += 1;
    
    if(action.runs % 2 !== 0) swapStrikeInternal();
    if(state.legalBalls % 6 === 0) endOverInternal();
  } 
  else if (action.type === 'EXTRA') {
    const isLegal = (action.eType === 'B' || action.eType === 'LB');
    const penalty = (action.eType === 'WD' || action.eType === 'NB') ? 1 : 0;
    const total = action.runs + penalty;
    
    state.score += total;
    state.overLog.push(`${action.eType}${action.runs>0 ? '+'+action.runs : ''}`);
    
    if(isLegal) { state.legalBalls += 1; striker.balls += 1; bowler.bBalls += 1; }
    else { bowler.bRuns += total; }
    
    if(action.runs % 2 !== 0) swapStrikeInternal();
    if(isLegal && state.legalBalls % 6 === 0) endOverInternal();
  }
  else if (action.type === 'WICKET') {
    state.wickets += 1; state.legalBalls += 1; state.overLog.push('W');
    striker.isOut = true; striker.balls += 1; bowler.bBalls += 1;
    if(action.wType !== 'RUN_OUT') bowler.bWkts += 1;
    
    const nextBat = state.squads[tBat].find(p => !p.isOut && p.id !== state.striker && p.id !== state.nonStriker);
    if(nextBat) state.striker = nextBat.id;
    if(state.legalBalls % 6 === 0) endOverInternal();
  }
  else if (action.type === 'SWAP_STRIKE') { swapStrikeInternal(); }
  else if (action.type === 'END_OVER') { endOverInternal(); }
  
  checkMatchEnd();
  saveState();
};

function swapStrikeInternal() { const t = state.striker; state.striker = state.nonStriker; state.nonStriker = t; }
function endOverInternal() { swapStrikeInternal(); state.lastBowler = state.bowler; state.overLog = []; }

window.dispatchExtra = function(type) { const r = prompt(`Runs completed on ${type}?`, "0"); if(r !== null) dispatch({type: 'EXTRA', eType: type, runs: parseInt(r)}); };
window.dispatchWicket = function(type) { dispatch({type: 'WICKET', wType: type}); };
window.startSecondInnings = function() {
  if(!confirm("Start 2nd Innings?")) return;
  pushSnapshot("2nd Innings Started");
  state.target = state.score + 1; state.score = 0; state.wickets = 0; state.legalBalls = 0; state.overLog = []; state.innings = 2;
  const oldBat = state.meta.batTeam; state.meta.batTeam = state.meta.bowlTeam; state.meta.bowlTeam = oldBat;
  state.striker = state.squads[state.meta.batTeam][0].id; state.nonStriker = state.squads[state.meta.batTeam][1].id; state.bowler = state.squads[state.meta.bowlTeam][0].id;
  saveState();
};

function checkMatchEnd() {
  if(state.innings === 2 && state.score >= state.target) alert("CHASING TEAM WON!");
  if(state.wickets >= 10 || state.legalBalls >= state.meta.maxOvers * 6) alert("INNINGS COMPLETE!");
}

window.manualChange = function() { state.striker = document.getElementById('strikerSelect').value; state.nonStriker = document.getElementById('nonStrikerSelect').value; state.bowler = document.getElementById('bowlerSelect').value; saveState(); };

function updateUI() {
  if(!state) return;
  const tBat = state.meta.batTeam; const tBowl = state.meta.bowlTeam;
  document.getElementById('hudTeam').innerText = state.meta[tBat === 'A' ? 'tA' : 'tB'];
  document.getElementById('hudScore').innerText = `${state.score}/${state.wickets}`;
  document.getElementById('hudOvers').innerText = `${Math.floor(state.legalBalls/6)}.${state.legalBalls%6}`;
  document.getElementById('hudCrr').innerText = state.legalBalls > 0 ? ((state.score / state.legalBalls) * 6).toFixed(2) : "0.00";
  
  if(state.target) { document.getElementById('hudTargetBox').style.display = "block"; document.getElementById('hudTarget').innerText = state.target; const remBalls = (state.meta.maxOvers*6)-state.legalBalls; document.getElementById('hudRrr').innerText = remBalls > 0 ? (((state.target - state.score) / remBalls) * 6).toFixed(2) : "0.00"; }
  
  document.getElementById('strikerSelect').innerHTML = state.squads[tBat].filter(p => !p.isOut).map(p => `<option value="${p.id}" ${state.striker===p.id?'selected':''}>${p.name}</option>`).join('');
  document.getElementById('nonStrikerSelect').innerHTML = state.squads[tBat].filter(p => !p.isOut).map(p => `<option value="${p.id}" ${state.nonStriker===p.id?'selected':''}>${p.name}</option>`).join('');
  document.getElementById('bowlerSelect').innerHTML = state.squads[tBowl].filter(p => p.id !== state.lastBowler).map(p => `<option value="${p.id}" ${state.bowler===p.id?'selected':''}>${p.name}</option>`).join('');

  document.getElementById('timelineList').innerHTML = timeline.map(t => `<div class="tl-item"><span>${t.desc}</span><button onclick="undoToEvent(${t.id})">UNDO</button></div>`).join('');
}

const saved = localStorage.getItem('bc_state');
if(saved) { state = JSON.parse(saved); updateUI(); } else { initDummyMatch(); }
</script>
</body>
</html>
